  if ($("#swap")) $("#swap").onclick=()=>swapDish(slot);
  $("#copyPrompt").onclick=()=>copy(imagePrompt(d),"Промпт скопирован");
  $("#photoIn").onchange=e=>loadPhoto(e.target.files[0], id);
  if ($("#delPhoto")) $("#delPhoto").onclick=()=>{ try{localStorage.removeItem(photoKey(id));}catch(e){} openDish(id,slot); render(); };
}
function closeModal(){ $("#modal").hidden=true; $("#modal").innerHTML=""; document.body.classList.remove("lock"); render(); }

function swapDish(slot){
  const plan=state.weeks[slot.w], day=plan.days[slot.di];
  const cur = slot.side ? (day.x||{})[slot.m] : slot.baby ? day.baby[slot.p][slot.m] : slot.m==="s" ? day.s[slot.p] : day[slot.m];
  const people = slot.p ? state.family.filter(p=>p.id===slot.p) : state.family.filter(p=>personType(p)!=="infant");
  const forbid=new Set(people.flatMap(p=>p.allergens||[]));
  const usedWeek=new Set(plan.days.flatMap(d=>[d.b,d.l,d.d]));
  const cands=DISHES.filter(d=>!!d.baby===!!slot.baby && !!d.side===!!slot.side && !d.extra && d.m.includes(slot.m) && d.id!==cur && !hasAllergen(d,forbid))
    .map(d=>({d,s:people.reduce((a,p)=>a+personScore(p,d),0)+(state.ratings[d.id]||0)*4-(usedWeek.has(d.id)?6:0)+Math.random()*3}))
    .sort((a,b)=>b.s-a.s);
  if (!cands.length) return toast("Подходящей замены нет");
  const nd=cands[0].d.id;
  if (slot.side){ day.x=day.x||{}; day.x[slot.m]=nd; } else if (slot.baby) day.baby[slot.p][slot.m]=nd; else if (slot.m==="s") day.s[slot.p]=nd; else day[slot.m]=nd;
  save(); openDish(nd,slot); toast("Блюдо заменено");
}
function loadPhoto(file, id){
  if (!file) return; const fr=new FileReader();
  fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const W=640, sc=Math.min(1,W/im.width); const c=document.createElement("canvas"); c.width=im.width*sc; c.height=im.height*sc;
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    try { localStorage.setItem(photoKey(id), c.toDataURL("image/jpeg",0.78)); toast("Фото сохранено"); } catch(e){ toast("Не хватает места в браузере для фото"); }
    openDish(id, modalCtx && modalCtx.slot); }; im.src=fr.result; };
  fr.readAsDataURL(file);
}

function copy(text,msg){ (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(()=>toast(msg)).catch(()=>{
  const t=document.createElement("textarea"); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand("copy"); toast(msg);}catch(e){toast("Не удалось скопировать");} t.remove(); }); }
function menuText(){
  const plan=state.weeks[state.view]; const inf=state.family.filter(p=>personType(p)==="infant"); const sh=state.family.filter(p=>personType(p)!=="infant");
  let t=`Меню на ${weekTitle(state.view)}\n`;
  plan.days.forEach((d,i)=>{ const sd=m=>d.x&&d.x[m]&&DISH_BY_ID[d.x[m]]?` + ${DISH_BY_ID[d.x[m]].n.toLowerCase()}`:""; t+=`\n${DAYS[i]}\n Завтрак: ${DISH_BY_ID[d.b].n}${sd("b")}\n Обед: ${DISH_BY_ID[d.l].n}${sd("l")}\n Ужин: ${DISH_BY_ID[d.d].n}${sd("d")}\n`;
    sh.forEach(p=>{ if(d.s[p.id]) t+=` Перекус (${p.name}): ${DISH_BY_ID[d.s[p.id]].n}\n`; });
    inf.forEach(p=>{ const b=d.baby[p.id]||{}; t+=` ${p.name}: смесь ${p.formulaAm} мл · ${["b","l","s","d"].map(m=>b[m]?DISH_BY_ID[b[m]].n:"").join(" · ")} · смесь ${p.formulaPm} мл\n`; }); });
  return t;
}
function shopText(){
  const list=shoppingList(state,state.weeks[state.view]); const by={}; list.forEach(x=>(by[x.dept]=by[x.dept]||[]).push(x));
  return `Покупки на ${weekTitle(state.view)}\n`+Object.keys(by).sort().map(d=>`\n${d}:\n`+by[d].map(x=>`— ${x.name}: ${fmtQty(x.id,x.g)} (${packsFor(x.id,x.g)} уп.)`).join("\n")).join("\n");
}
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200); }

function wzBind(){
  const w=wiz, on=(id,fn)=>{ const e=$("#"+id); if(e) e.onclick=fn; };
  on("wzNext",()=>{ if (w.step===5){ w.step=6; wzRender(); setTimeout(wzFinish, 2300); } else { w.step++; wzRender(); $(".wz-body").scrollTop=0; } });
  on("wzBack",()=>{ w.step--; wzRender(); });
  on("wzClose",wzClose);
  on("wzSkip",()=>{ state.onboarded=true; save(); wzClose(); });
  document.querySelectorAll("#wizard [data-wf]").forEach(inp=>inp.onchange=()=>{ const p=w.fam[+inp.dataset.i], f=inp.dataset.wf;
    const t0=personType(p); p[f] = (f==="name"||f==="sex") ? inp.value : +inp.value; if (f==="age"&&personType(p)!=="adult") p.goal="keep"; if (f==="age" && personType(p)!==t0) wzRender(); });
  document.querySelectorAll("#wizard [data-wf='name']").forEach(inp=>inp.oninput=()=>{ w.fam[+inp.dataset.i].name=inp.value; const b=$("#wzNext"); if(b) b.disabled=!w.fam.every(p=>String(p.name).trim()); });
  document.querySelectorAll("#wizard [data-wadd]").forEach(b=>b.onclick=()=>{ w.fam.push(wzPerson(b.dataset.wadd)); wzRender(); const l=document.querySelectorAll(".wz-card"); l[l.length-1].scrollIntoView({block:"center"}); });
  document.querySelectorAll("#wizard [data-wdel]").forEach(b=>b.onclick=()=>{ w.fam.splice(+b.dataset.wdel,1); w.who=0; wzRender(); });
  document.querySelectorAll("#wizard [data-wgoal]").forEach(b=>b.onclick=()=>{ w.fam[+b.dataset.i].goal=b.dataset.wgoal; wzRender(); });
  document.querySelectorAll("#wizard [data-wwho]").forEach(b=>b.onclick=()=>{ w.who=+b.dataset.wwho; wzRender(); });
  document.querySelectorAll("#wizard [data-wtog]").forEach(b=>b.onclick=()=>{ const p=w.fam[w.who], g=b.dataset.wtog, v=b.dataset.v; p[g]=p[g]||[];
    p[g]=p[g].includes(v)?p[g].filter(x=>x!==v):p[g].concat(v); wzRender(); });
  document.querySelectorAll("#wizard [data-wbud]").forEach(b=>b.onclick=()=>{ w.budget=+b.dataset.wbud; wzRender(); });
  const bi=$("#wzBudget"); if(bi) bi.onchange=()=>{ w.budget=+bi.value||0; wzRender(); };
  if (w.step===4) kitchenBind(w.kit,"wk",wzRender);
}
function wzFinish(){
  const w=wiz; if(!w) return;
  state.family=w.fam; state.kitchen=w.kit; state.settings.budget=w.budget; state.onboarded=true;
  Object.keys(state.weeks).filter(k=>k>=curKey).forEach(k=>delete state.weeks[k]);
  state.view=null; mobileDay=null; showAll=false; state.tab="week";
  ensureWeeks(); save(); wzClose(); render(); window.scrollTo(0,0);
  toast("Меню готово. Изменить данные можно во вкладке «Семья»");
}
if (!state.onboarded) openWizard();

// ===== УЧЁТНЫЕ ЗАПИСИ: вход по логину и паролю =====
// Учётные записи хранятся в state.accounts: {login, salt, hash, memberId, role:"admin"|"member"}.
// Пароль не хранится — только его хеш (SHA-256 с солью, 2000 повторов).
// Администратор может всё. Участник видит меню, покупки и рецепты, ставит оценки
// и меняет только свою карточку в «Семье».

// --- SHA-256 (свой, чтобы работало и при открытии файла с телефона без https) ---
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes=new TextEncoder().encode(str), l=bytes.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n);
  m.set(bytes); m[l]=0x80; const bl=l*8; for(let i=0;i<8;i++) m[n-1-i]=Math.floor(bl/Math.pow(2,8*i))&255;
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W=new Array(64), r=(x,y)=>(x>>>y)|(x<<(32-y));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++) W[i]=(m[o+4*i]<<24)|(m[o+4*i+1]<<16)|(m[o+4*i+2]<<8)|m[o+4*i+3];
    for(let i=16;i<64;i++){ const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3), s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10); W[i]=(W[i-16]+s0+W[i-7]+s1)|0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+W[i])|0, S0=r(a,2)^r(a,13)^r(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0; }
    H=[H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x|0);
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
function passHash(pass, salt){ let h=salt+"|"+pass; for(let i=0;i<2000;i++) h=sha256hex(h+salt); return h; }
function newSalt(){ const a=new Uint8Array(12); (window.crypto||{}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_,i)=>a[i]=Math.random()*256|0); return Array.from(a,x=>x.toString(16).padStart(2,"0")).join(""); }

const SESSION_KEY="familyMenu.session";
const normLogin = s => String(s||"").trim().toLowerCase();
function accounts(){ return state.accounts||(state.accounts=[]); }
function authOn(){ return accounts().length>0; }
function readSession(){ try { return sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY); } catch(e){ return null; } }
function currentUser(){ if(!authOn()) return null; const l=readSession(); return accounts().find(a=>a.login===l)||null; }
function isAdmin(){ const u=currentUser(); return !authOn() || (u && u.role==="admin"); }
function memberOf(acc){ return acc && state.family.find(p=>p.id===acc.memberId); }
function setSession(login, remember){ try { sessionStorage.setItem(SESSION_KEY,login); if(remember) localStorage.setItem(SESSION_KEY,login); else localStorage.removeItem(SESSION_KEY); } catch(e){} }
function clearSession(){ try { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY); } catch(e){} }

// --- Экран входа ---
function showLogin(msg){
  let box=$("#auth"); if(!box){ box=document.createElement("div"); box.id="auth"; document.body.appendChild(box); }
  const logo=document.querySelector(".top .logo"); const names=accounts().map(a=>{ const p=memberOf(a); return `<button class="pill" data-pick="${esc(a.login)}">${esc(p?p.name:a.login)}</button>`; }).join("");
  box.innerHTML=`<form class="abox" autocomplete="on">
    <div class="alogo">${logo?logo.outerHTML:""}</div>
    <h2>Вход в «Наш стол»</h2>
    <p class="muted">Кто заходит?</p><div class="apick">${names}</div>
    <label>Логин<input id="aLogin" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Пароль<input id="aPass" name="password" type="password" autocomplete="current-password" required></label>
    <label class="arem"><input type="checkbox" id="aRem" checked> Не выходить на этом устройстве</label>
    <p class="aerr" id="aErr" role="alert">${msg?esc(msg):""}</p>
    <button class="btn" type="submit">Войти</button>
    <p class="muted small">Забыли пароль? Попросите администратора семьи сбросить его во вкладке «Семья».</p></form>`;
  box.hidden=false; document.body.classList.add("locked");
  box.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ $("#aLogin").value=b.dataset.pick; $("#aPass").focus(); });
  box.querySelector("form").onsubmit=e=>{
    e.preventDefault();
    const l=normLogin($("#aLogin").value), p=$("#aPass").value, a=accounts().find(x=>x.login===l);
    if(!a || passHash(p,a.salt)!==a.hash){ $("#aErr").textContent="Неверный логин или пароль"; $("#aPass").value=""; return; }
    setSession(a.login, $("#aRem").checked); hideLogin(); userChip(); const m=memberOf(a);
    if(m && a.role!=="admin"){ state.tab=state.tab||"week"; }
    render(); toast("Здравствуйте, "+(m?m.name:a.login)+"!");
    if(!state.onboarded && a.role==="admin") openWizard();
  };
}
function hideLogin(){ const b=$("#auth"); if(b){ b.hidden=true; b.innerHTML=""; } document.body.classList.remove("locked"); }
function logout(){ clearSession(); closeModalSafe(); showLogin(); userChip(); }
function closeModalSafe(){ if(!$("#modal").hidden){ $("#modal").hidden=true; $("#modal").innerHTML=""; document.body.classList.remove("lock"); } const w=$("#wizard"); if(w && !w.hidden){ w.hidden=true; w.innerHTML=""; } }

// --- Плашка пользователя в шапке ---
function userChip(){
  let c=$("#uchip"); const u=currentUser();
  if(!u){ if(c) c.remove(); return; }
  if(!c){ c=document.createElement("div"); c.id="uchip"; document.querySelector(".top").appendChild(c); }
  const m=memberOf(u);
  c.innerHTML=`<span class="uav">${esc(((m?m.name:u.login)||"?").charAt(0).toUpperCase())}</span><span class="un"><b>${esc(m?m.name:u.login)}</b><small>${u.role==="admin"?"администратор":"участник"}</small></span><button class="pill" id="logout">Выйти</button>`;
  $("#logout").onclick=logout;
}

// --- Раздел «Вход по паролю» во вкладке «Семья» ---
function memberOptions(sel){
  return state.family.filter(p=>targets(p).type!=="infant").map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.name)}</option>`).join("");
}
function accountsSection(){
  const u=currentUser();
  if(authOn() && (!u || u.role!=="admin")){
    return `<details class="settings sub" data-sub="acc" ${openSubs.acc?"open":""}><summary>Мой вход</summary>
      <p class="muted small">Вы вошли как «${esc(u?u.login:"")}». Здесь можно сменить свой пароль.</p>
      <div class="fields"><label>Новый пароль<input type="password" id="myPass" autocomplete="new-password"></label><label>Ещё раз<input type="password" id="myPass2" autocomplete="new-password"></label></div>
      <div class="backup"><button class="btn ghost" id="myPassBtn">Сменить пароль</button></div></details>`;
  }
  const rows=accounts().map((a,i)=>{ const m=memberOf(a); return `<div class="arow"><span class="uav">${esc(((m?m.name:a.login)||"?").charAt(0).toUpperCase())}</span>
    <span class="an"><b>${esc(m?m.name:"(нет в семье)")}</b><small>логин: ${esc(a.login)} · ${a.role==="admin"?"администратор":"участник"}${u&&u.login===a.login?" · это вы":""}</small></span>
    <span class="aact"><button class="pill" data-apass="${i}">Новый пароль</button>${u&&u.login===a.login?"":`<button class="pill" data-arole="${i}">${a.role==="admin"?"Сделать участником":"Сделать админом"}</button><button class="pill x" data-adel="${i}">Удалить</button>`}</span></div>`; }).join("");
  const first=!authOn();
  return `<details class="settings sub" data-sub="acc" ${openSubs.acc?"open":""}><summary>Вход по логину и паролю${authOn()?` <span class="cnt">${accounts().length}</span>`:""}</summary>
    <p class="muted small">${first
      ? "Сейчас приложение открывается без пароля. Создайте первую учётную запись — это будет администратор: он настраивает семью и выдаёт логины остальным."
      : "Администратор может всё. Участник видит меню, покупки и рецепты, ставит оценки и меняет только свою карточку."}</p>
    ${rows?`<div class="alist">${rows}</div>`:""}
    <div class="lbl">${first?"Создать администратора":"Добавить учётную запись"}</div>
    <div class="fields">
      <label>Кто<select id="accWho">${memberOptions()}</select></label>
      <label>Логин<input id="accLogin" autocapitalize="none" spellcheck="false" placeholder="например, mama"></label>
      <label>Пароль<input id="accPass" type="password" autocomplete="new-password" placeholder="не короче 4 символов"></label>
      ${first?"":`<label>Права<select id="accRole"><option value="member">Участник</option><option value="admin">Администратор</option></select></label>`}
    </div>
    <div class="backup"><button class="btn" id="accAdd">${first?"Включить вход по паролю":"Добавить"}</button>${authOn()?`<button class="btn ghost danger" id="accOff">Отключить вход по паролю</button>`:""}</div>
    <p class="muted small">Учётные записи хранятся на этом устройстве (и попадают в резервную копию). На другом телефоне войти с тем же паролем можно, если загрузить туда копию.</p>
  </details>`;
}
function bindAccounts(){
  const on=(id,fn)=>{ const e=$("#"+id); if(e) e.onclick=fn; };
  on("accAdd",()=>{
    const who=$("#accWho").value, login=normLogin($("#accLogin").value), pass=$("#accPass").value, role=authOn()?$("#accRole").value:"admin";
    if(!who) return toast("Сначала добавьте человека в семью");
    if(!/^[a-zа-яё0-9._-]{2,20}$/i.test(login)) return toast("Логин: 2–20 букв или цифр, без пробелов");
    if(accounts().some(a=>a.login===login)) return toast("Такой логин уже есть");
    if(pass.length<4) return toast("Пароль должен быть не короче 4 символов");
    const salt=newSalt(); const wasOff=!authOn();
    accounts().push({login, salt, hash:passHash(pass,salt), memberId:who, role});
    if(wasOff) setSession(login,true);
    openSubs.acc=true; save(); render(); userChip();
    toast(wasOff?"Вход по паролю включён. Вы — администратор":"Учётная запись создана");
  });
  on("accOff",()=>{ const b=$("#accOff"); if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Нажмите ещё раз — все логины удалятся"; return; }
    state.accounts=[]; clearSession(); save(); render(); userChip(); toast("Вход по паролю отключён"); });
  document.querySelectorAll("[data-apass]").forEach(b=>b.onclick=()=>{ const a=accounts()[+b.dataset.apass]; const row=b.closest(".arow");
    if(row.querySelector(".apin")) return;
    const d=document.createElement("div"); d.className="apin"; d.innerHTML=`<input type="password" placeholder="Новый пароль" autocomplete="new-password"><button class="pill">Сохранить</button>`; row.appendChild(d);
    d.querySelector("input").focus();
    d.querySelector("button").onclick=()=>{ const p=d.querySelector("input").value; if(p.length<4) return toast("Пароль должен быть не короче 4 символов"); a.salt=newSalt(); a.hash=passHash(p,a.salt); save(); render(); toast("Пароль изменён"); }; });
  document.querySelectorAll("[data-arole]").forEach(b=>b.onclick=()=>{ const a=accounts()[+b.dataset.arole]; a.role=a.role==="admin"?"member":"admin"; save(); render(); toast("Права изменены"); });
  document.querySelectorAll("[data-adel]").forEach(b=>b.onclick=()=>{ if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Точно удалить?"; return; } accounts().splice(+b.dataset.adel,1); save(); render(); toast("Учётная запись удалена"); });
  on("myPassBtn",()=>{ const u=currentUser(), p=$("#myPass").value; if(p.length<4) return toast("Пароль должен быть не короче 4 символов"); if(p!==$("#myPass2").value) return toast("Пароли не совпадают"); u.salt=newSalt(); u.hash=passHash(p,u.salt); save(); render(); toast("Пароль изменён"); });
}

// --- Ограничения для участника ---
function applyRole(){
  const u=currentUser(); if(!u || u.role==="admin") return;
  if(state.tab!=="family") return;
  document.querySelectorAll(".fcard").forEach(card=>{
    const p=state.family[+card.dataset.idx]; if(p && p.id===u.memberId) return;
    card.querySelectorAll("input,select,.chip,.segb,[data-del]").forEach(el=>{ el.disabled=true; if(el.matches("[data-del]")) el.remove(); });
    card.classList.add("ro");
    const note=document.createElement("p"); note.className="muted small"; note.textContent="Менять данные может только сам человек или администратор."; card.querySelector(".fbody").prepend(note);
  });
  document.querySelectorAll(".fcard [data-del]").forEach(b=>b.remove());
  document.querySelectorAll(".wz-add,#reWizard,details[data-sub='kit'],details[data-sub='set']").forEach(el=>el.remove());
}

// --- Подключение к приложению ---
const _renderFamily=renderFamily; renderFamily=function(){ return _renderFamily()+accountsSection(); };
const _render=render; render=function(){ if(authOn() && !currentUser()){ showLogin(); return; } _render(); if(state.tab==="family") bindAccounts(); applyRole(); };
const _openWizard=openWizard; openWizard=function(){ if(authOn() && !isAdmin()) return toast("Настраивать семью может только администратор"); _openWizard(); };
const _openReset=openReset; openReset=function(a){ if(authOn() && !isAdmin()) return toast("Это может сделать только администратор"); _openReset(a); };

if(authOn() && !currentUser()){ closeModalSafe(); showLogin(); } else { userChip(); render(); }

</script>
</body>
