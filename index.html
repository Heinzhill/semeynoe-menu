<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f0e8">
<meta name="description" content="Меню на неделю для всей семьи: профили, цели, аллергены, детский рацион, список покупок">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Наш стол">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Наш стол</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito:wght@400;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
/* Натуральный стиль: льняная бумага, мох, шалфей, мёд. Сетка недели: дни строками, приёмы пищи колонками */
:root{
  --paper:#f2efe4; --card:#fbfaf4; --ink:#28331f; --muted:#6b725f; --line:#dcd6c3;
  --moss:#4e6a3c; --sage:#a9ba92; --sage-soft:#e4e9d6; --honey:#b98a2e; --honey-soft:#f3e7c7;
  --good:#4f7a35; --warn:#a8741a; --bad:#a3402f;
  --display:"Lora", Georgia, "Times New Roman", serif;
  --body:"Nunito", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);
  background-image:radial-gradient(circle at 12% 0%, #e7ecd9 0, transparent 40%),radial-gradient(circle at 100% 30%, #efe5cc 0, transparent 35%)}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
h2{font-size:1.45rem} h3{font-size:1.08rem;margin:18px 0 8px}
.muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
.top{display:flex;align-items:center;gap:14px;padding:18px max(16px,4vw) 10px}
.top svg{flex:none}
.top h1{font-size:1.6rem;line-height:1.1}
.top p{margin:2px 0 0;font-size:.9rem}
nav{display:flex;gap:4px;padding:0 max(16px,4vw);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;background:var(--paper);z-index:5}
.tab{border:0;background:none;padding:12px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--moss);border-bottom-color:var(--moss)}
main{padding:18px max(16px,4vw) 60px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.head-row p{margin:4px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--moss);color:#fbfaf4;border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:#3f5830}
.btn.ghost{background:transparent;color:var(--moss);border:1.5px solid var(--moss)}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:.9rem}
.pill.on{background:var(--sage-soft);border-color:var(--moss);color:var(--moss)}
.weeksw{display:flex;gap:6px}
.banner{background:var(--honey-soft);border:1px solid #e2cf9c;border-radius:14px;padding:12px 16px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pcard header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.goal{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sage-soft);color:var(--moss);white-space:nowrap}
.goal.g-gain{background:#efe0c4;color:#86601a}.goal.g-lose{background:#e2ebe4;color:#3e6b52}.goal.g-baby{background:#f1e4e0;color:#8a4a3e}
.kc{display:flex;align-items:baseline;gap:8px}.big{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:#e6e1d1;overflow:hidden}.bar i{display:block;height:100%;background:var(--good)}
.bar.low i{background:var(--warn)}.bar.high i{background:var(--bad)}
.bju{display:flex;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.recs{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px 12px}
.recs ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.recs li{padding-left:16px;position:relative}
.recs li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--sage)}
.recs li.r-good::before{background:var(--good)}.recs li.r-warn::before{background:var(--warn)}
.grid{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.gh,.row{display:grid;grid-template-columns:130px repeat(3,minmax(0,1fr)) minmax(0,1.15fr);gap:10px;padding:10px 14px;align-items:start}
.gh{background:var(--sage-soft);font-weight:700;color:var(--moss);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em}
.row{border-top:1px solid var(--line)}
.row.today{background:#f6f3e6}
.row.baby{background:#f8f1ec;border-top:1px dashed #e3cfc6;grid-template-columns:130px 1fr}
.dl{display:flex;flex-direction:column}.dl b{font-family:var(--display)}
.dl .muted{font-size:.85rem}
.cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.ml{display:none;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dish{display:flex;align-items:center;gap:9px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;min-width:0;width:100%;position:relative}
.dish:hover{border-color:var(--sage);box-shadow:0 2px 8px rgba(60,70,40,.08)}
.thumb{width:48px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:#e9e3d2}
.dish.sm .thumb{width:36px;height:30px}
.dn{font-size:.88rem;line-height:1.25;overflow-wrap:anywhere}
.rt{position:absolute;right:6px;top:4px;font-size:.7rem}
.sn{display:flex;flex-direction:column;gap:2px}.who{font-size:.75rem;color:var(--muted);font-weight:700}
.babyline{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:center}
.babyline .ml,.babyline .fm .ml{display:block}
.bc,.fm{display:flex;flex-direction:column;gap:4px;min-width:0}
.formula{font-size:.85rem;background:#fff;border:1px dashed #d9bfb3;border-radius:10px;padding:8px 10px;white-space:nowrap}
/* Семья */
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.fcard,.settings{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fcard header{display:flex;align-items:center;gap:8px}
.nm{font-family:var(--display);font-size:1.2rem;font-weight:600;border:0;border-bottom:1.5px dashed var(--line);background:none;flex:1;min-width:0;padding:2px 0}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:600}
.fields .w2{grid-column:span 2}
.fields input,.fields select,.adddis{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;color:var(--ink);font-size:.92rem;min-width:0}
.norm{background:var(--sage-soft);border-radius:12px;padding:10px 12px;font-size:.92rem}
.norm .muted{font-size:.8rem}
.note{background:var(--honey-soft);border-radius:12px;padding:10px 12px;margin:0;font-size:.88rem}
.lbl{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:.82rem;cursor:pointer}
.chip.on{background:var(--moss);border-color:var(--moss);color:#fbfaf4}
.settings h3{margin:0}
.settings .fields{align-items:end}
/* Покупки */
.shop{columns:3 300px;column-gap:14px}
.dept{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px 10px;margin-bottom:14px}
.dept ul{list-style:none;margin:0;padding:0}
.dept li label{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #ece7d8;cursor:pointer;font-variant-numeric:tabular-nums}
.dept li:first-child label{border-top:0}
.dept input:checked ~ .pn{text-decoration:line-through;color:var(--muted)}
.dept .q{font-weight:700}.dept .c{font-size:.82rem;min-width:60px;text-align:right}
input[type=checkbox]{accent-color:var(--moss);width:17px;height:17px}
/* Рецепты */
.filters{display:flex;gap:8px;flex-wrap:wrap}
#q{border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:#fff;min-width:200px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.rcard:hover{border-color:var(--sage)}
.rimg{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#e9e3d2}
.rb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.rb b{font-family:var(--display);font-weight:600}
.rb .muted{font-size:.82rem;font-variant-numeric:tabular-nums}
.als{display:flex;flex-wrap:wrap;gap:4px}
.al{font-style:normal;font-size:.72rem;font-weight:700;background:#f1e4e0;color:#8a4a3e;border-radius:6px;padding:1px 7px}
.al.baby{background:var(--sage-soft);color:var(--moss)}
/* Как работает */
.how{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;max-width:780px}
.how ol{padding-left:20px;display:flex;flex-direction:column;gap:8px}
/* Окно */
#modal{position:fixed;inset:0;background:rgba(40,51,31,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:20px;max-width:760px;width:100%;max-height:100%;overflow:auto;position:relative;display:grid;grid-template-columns:1fr}
.mimg .big{width:100%;aspect-ratio:16/9;max-height:280px;object-fit:cover;display:block;background:#e9e3d2}
.mbody{padding:16px 22px 22px}
.mbody p{margin:4px 0 10px}
.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(251,250,244,.92);cursor:pointer;font-size:1rem}
.rate{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid #ece7d8}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase}
.ing{list-style:none;padding:0;margin:0;columns:2 220px;column-gap:20px}
.ing li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dotted var(--line);break-inside:avoid}
.ing li span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.steps{padding-left:20px;display:flex;flex-direction:column;gap:6px;margin:0}
.photo{margin-top:16px;background:var(--sage-soft);border-radius:12px;padding:10px 14px}
.photo summary{cursor:pointer;font-weight:700;color:var(--moss)}
.prompt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.85rem}
.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fbfaf4;padding:10px 18px;border-radius:999px;z-index:30;font-size:.9rem;max-width:90vw;text-align:center}
#toast[hidden]{display:none}

.tab{display:flex;align-items:center;gap:7px}
.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.daystrip{display:none}
.mday{display:none}
.install{background:var(--sage-soft);border:1px solid #cdd6bb;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.backup{display:flex;gap:8px;flex-wrap:wrap}

/* --- упрощённая неделя --- */
.wk-head{position:relative;z-index:6;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wk-head p{margin:4px 0 0}
.wk-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.t-mob{display:none}
.more{position:relative}
.more summary{list-style:none;cursor:pointer}.more summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(40,51,31,.14);padding:6px;display:flex;flex-direction:column;min-width:230px;z-index:8}
.more .menu button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:600}
.more .menu button:hover{background:var(--sage-soft)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.sum>summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;flex-direction:column;gap:8px}
.sum>summary::-webkit-details-marker{display:none}
.sumt{font-family:var(--display);font-weight:600;font-size:1.05rem}
.sumt::after{content:" ›";color:var(--muted)}
.sum[open] .sumt::after{content:" ˅"}
.sumchips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:.8rem;font-weight:700;background:var(--sage-soft);color:var(--moss);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.sc.w{background:var(--honey-soft);color:#86601a}
.sum .people{margin-bottom:12px}
.sum .recs{border:0;padding:0 0 14px;margin:0;list-style:none;display:flex;flex-direction:column;gap:6px;background:none}
/* --- семья --- */
details.fcard{padding:0;gap:0}
details.fcard>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px}
details.fcard>summary::-webkit-details-marker{display:none}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:1.15rem;background:var(--sage-soft);color:var(--moss);flex:none}
.av.g-gain{background:#efe0c4;color:#86601a}.av.g-lose{background:#e2ebe4;color:#3e6b52}.av.g-baby{background:#f1e4e0;color:#8a4a3e}
.fn{display:flex;flex-direction:column;flex:1;min-width:0}.fn b{font-size:1.05rem}.fn .muted{font-size:.85rem}
.chev{font-size:1.5rem;color:var(--muted);transition:transform .15s}
details.fcard[open] .chev{transform:rotate(90deg)}
.fbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.seg{display:flex;background:#ebe7da;border-radius:12px;padding:3px;gap:3px}
.segb{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--muted)}
.segb.on{background:var(--card);color:var(--moss);box-shadow:0 1px 3px rgba(40,51,31,.15)}
.seg.wide{min-width:240px}
label.one{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:600}
label.one select{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;font-size:.95rem;color:var(--ink)}
details.sub{background:#f6f3ea;border-radius:12px;padding:0 12px}
details.sub>summary{cursor:pointer;padding:12px 0;font-weight:700}
details.sub[open]{padding-bottom:12px}
details.sub .chips{margin-top:4px}
.cnt{display:inline-block;min-width:20px;text-align:center;background:var(--moss);color:#fbfaf4;border-radius:999px;font-size:.72rem;padding:1px 6px;margin-left:4px}
.small{font-size:.82rem;margin:0 0 6px}
.x{align-self:flex-start}
.addp{align-self:start}
.settings.sub{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.settings.sub[open]{padding-bottom:16px;display:block}
.settings .backup{margin:6px 0 10px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
/* --- покупки и цены --- */
.shopsum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.shopsum b{font-family:var(--display);font-size:1.4rem}
.dept li label{grid-template-columns:auto 1fr auto}
.pn{display:flex;flex-direction:column;font-weight:600}.pn small{font-size:.78rem;font-weight:400}
.dept .c{font-weight:700;text-align:right;white-space:nowrap}.dept .c small{margin-left:2px}
ul.prices li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #ece7d8}
ul.prices li:first-child{border-top:0}
.pin{display:flex;align-items:center;gap:4px;font-weight:700}
.pin input{width:92px;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:right;background:#fff;font-size:16px;font-variant-numeric:tabular-nums}
.pin input:not(:placeholder-shown){border-color:var(--moss);background:var(--sage-soft)}
#pq{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;min-width:200px;font-size:16px}

/* --- способы приготовления --- */
.dt{display:flex;flex-direction:column;min-width:0}
.dm{font-size:.74rem;color:var(--muted);font-weight:600}
.mseg{margin:4px 0 10px;flex-wrap:wrap}
.seg.wrap{flex-wrap:wrap}.seg.wrap .segb{flex:1 1 30%}
.pill.sm{padding:4px 10px;font-size:.8rem;min-height:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;min-width:0;overflow-wrap:anywhere;text-align:center;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-weight:700;font-size:.78rem;color:var(--muted)}
.tile svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile.on{border-color:var(--moss);background:var(--sage-soft);color:var(--moss)}
.chip.on.bad{background:var(--bad);border-color:var(--bad)}
/* --- мастер настройки --- */
#wizard{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;justify-content:center}
#wizard[hidden]{display:none}
.wz{width:100%;max-width:640px;display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
.wz-top{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;min-height:44px}
.wz-prog{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.wz-prog span{font-size:.66rem;font-weight:700;color:var(--muted);border-top:4px solid #e2ddcd;padding-top:5px;text-align:center}
.wz-prog span.on{border-color:var(--moss);color:var(--moss)}
.wz-x,.wz-skip{border:0;background:none;color:var(--muted);font-weight:700;cursor:pointer;margin-left:auto;padding:8px}
.wz-body{flex:1;overflow:auto;padding:10px 18px 24px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.wz-body h2{font-size:1.5rem}
.wz-body>p{margin:0}
.wz-foot{display:flex;justify-content:space-between;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.wz-foot .btn{min-height:48px;padding:10px 22px;font-size:1rem}
.wz-foot #wzNext{flex:1;max-width:320px;margin-left:auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.wz-hero{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:20px}
.wz-plan{padding-left:20px;display:flex;flex-direction:column;gap:8px;font-weight:600}

/* ===== ПРЕМИУМ-СЛОЙ: мягкие тени, крупные скругления, стекло, плавность ===== */
:root{
  --paper:#f3f0e8; --card:#fffdf8; --ink:#1f2a1a; --muted:#6f7566; --line:rgba(31,42,26,.09);
  --moss:#3d5a2e; --moss-deep:#2c4321; --sage-soft:#e8ede0; --gold:#a8864f; --gold-soft:#f4ecdc;
  --sh1:0 1px 2px rgba(31,42,26,.04),0 6px 20px rgba(31,42,26,.06);
  --sh2:0 2px 8px rgba(31,42,26,.06),0 22px 48px rgba(31,42,26,.12);
  --ease:cubic-bezier(.2,.8,.2,1);
}
body{background:var(--paper);background-image:radial-gradient(1200px 600px at 0% -10%,#e6ecdc 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#f1e7d2 0,transparent 55%);background-attachment:fixed;-webkit-font-smoothing:antialiased}
h2{font-size:1.65rem;letter-spacing:-.015em;line-height:1.15}
h3{letter-spacing:-.01em}
.top h1{letter-spacing:-.02em}
.top>svg.logo{filter:drop-shadow(0 4px 12px rgba(31,42,26,.10));border-radius:50%;flex:none}
.lbl,.ml,.gh,th{color:var(--gold)!important;letter-spacing:.12em;font-size:.68rem!important}
.muted{color:var(--muted)}
/* поверхности */
.grid,.sum,.pcard,details.fcard,.dept,.rcard,.settings.sub,.shopsum,.wz-card,.how,.recs,.fcard,.wz-sum{
  background:var(--card);border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh1);border-radius:24px}
.pcard{border-radius:20px}
.gh{background:linear-gradient(180deg,#f3f5ee,#eef2e6);border-radius:24px 24px 0 0}
.row{border-top:1px solid var(--line)}
.row.today{background:linear-gradient(90deg,rgba(232,237,224,.7),rgba(255,253,248,0))}
.row.baby{background:linear-gradient(180deg,#fbf6f1,#f8f0ea);border-top:1px solid rgba(168,134,79,.15)}
/* карточки блюд */
.dish{border:0;border-radius:18px;background:linear-gradient(180deg,#ffffff,#fffaf2);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(31,42,26,.05),0 8px 22px rgba(31,42,26,.07);
  padding:8px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.dish:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(31,42,26,.06),0 16px 34px rgba(31,42,26,.11)}
.dish:active{transform:scale(.985)}
.thumb{border-radius:14px;box-shadow:0 2px 8px rgba(31,42,26,.10)}
.dn{font-weight:600;letter-spacing:-.005em}
.dm{color:var(--gold);font-weight:700;letter-spacing:.02em}
.formula{border:0;background:linear-gradient(180deg,#fff,#fbf4ee);box-shadow:var(--sh1);border-radius:14px}
/* кнопки */
.btn{background:linear-gradient(180deg,#4b6c39,#33502a);color:#fffdf6;border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 20px rgba(51,80,42,.26);
  letter-spacing:.01em;transition:transform .25s var(--ease),box-shadow .25s var(--ease),filter .25s}
.btn:hover{filter:brightness(1.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 26px rgba(51,80,42,.32)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,253,248,.75);color:var(--moss);border:1px solid rgba(61,90,46,.22);box-shadow:var(--sh1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill{border:1px solid var(--line);background:rgba(255,253,248,.8);box-shadow:0 1px 2px rgba(31,42,26,.04);transition:all .25s var(--ease)}
.pill.on{background:linear-gradient(180deg,#eef2e7,#e3eadb);border-color:rgba(61,90,46,.25);color:var(--moss-deep)}
.chip{border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(31,42,26,.04);padding:6px 12px;transition:all .2s var(--ease)}
.chip.on{background:linear-gradient(180deg,#4b6c39,#33502a);border-color:transparent;box-shadow:0 4px 12px rgba(51,80,42,.22)}
.chip.on.bad{background:linear-gradient(180deg,#b5503d,#953b2c);box-shadow:0 4px 12px rgba(149,59,44,.25)}
.seg{background:rgba(31,42,26,.06);border-radius:999px;padding:4px;gap:2px;box-shadow:inset 0 1px 2px rgba(31,42,26,.06)}
.segb{border-radius:999px;transition:all .3s var(--ease)}
.segb.on{background:#fffdf8;color:var(--moss-deep);box-shadow:0 2px 8px rgba(31,42,26,.12)}
.seg.wrap{border-radius:22px}.seg.wrap .segb{border-radius:18px}
.tile{border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--sh1);transition:all .3s var(--ease)}
.tile.on{background:linear-gradient(180deg,#f3f6ee,#e6ecdd);border-color:rgba(61,90,46,.35);box-shadow:0 0 0 3px rgba(61,90,46,.08),var(--sh1)}
/* поля */
.fields input,.fields select,.adddis,#q,#pq,label.one select,label.one.big input,.pin input{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:inset 0 1px 2px rgba(31,42,26,.04);transition:box-shadow .2s,border-color .2s}
.fields input:focus,.fields select:focus,#q:focus,#pq:focus,.pin input:focus,label.one.big input:focus{outline:none;border-color:rgba(61,90,46,.45);box-shadow:0 0 0 4px rgba(61,90,46,.10)}
.norm{background:linear-gradient(180deg,#f1f4ea,#e8ede0);border-radius:16px}
.note,.banner,.install{background:linear-gradient(180deg,#faf4e6,#f4ecdc);border:1px solid rgba(168,134,79,.18);border-radius:18px}
details.sub{background:linear-gradient(180deg,#faf8f2,#f5f2ea);border-radius:16px;border:1px solid rgba(255,255,255,.7)}
.av{box-shadow:inset 0 0 0 1.5px rgba(168,134,79,.35)}
.goal,.sc{letter-spacing:.01em}
/* день недели */
.dbtn{border:0;border-radius:18px;background:rgba(255,253,248,.85);box-shadow:var(--sh1);transition:all .3s var(--ease)}
.dbtn.on{background:linear-gradient(180deg,#4b6c39,#2f4a25);box-shadow:0 10px 22px rgba(51,80,42,.30)}
.dbtn.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--gold),var(--sh1)}
/* меню «Ещё» */
.more .menu{border:1px solid rgba(255,255,255,.7);border-radius:20px;box-shadow:var(--sh2);background:rgba(255,253,248,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:pop .25s var(--ease)}
/* окно рецепта */
#modal{background:rgba(22,30,17,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .25s ease}
.mbox{border-radius:28px;box-shadow:var(--sh2);animation:pop .35s var(--ease)}
.mimg .big{border-radius:0}
.close{background:rgba(255,253,248,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:var(--sh1)}
.steps li::marker{color:var(--gold);font-weight:700}
.ing li{border-bottom:1px solid var(--line)}
.photo{background:linear-gradient(180deg,#f1f4ea,#e8ede0);border-radius:18px}
/* тост */
#toast{background:rgba(31,42,26,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;box-shadow:var(--sh2);padding:12px 20px;animation:pop .3s var(--ease)}
/* плавность */
#main>*{animation:fadeUp .45s var(--ease) both}
#main>*:nth-child(2){animation-delay:.04s}#main>*:nth-child(3){animation-delay:.08s}#main>*:nth-child(4){animation-delay:.12s}#main>*:nth-child(5){animation-delay:.16s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
/* мастер */
.wz-prog span{border-top-width:3px;border-radius:2px}
.wz-prog span.on{border-color:var(--gold);color:var(--moss-deep)}
.wz-foot{background:var(--paper);border-top:0;box-shadow:none;position:relative}
.wz-foot::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:28px;background:linear-gradient(to bottom,rgba(243,240,232,0),var(--paper));pointer-events:none}
.wz.still .wz-body>*,.wz.still .wz-body *{animation:none!important}
.wz-foot.solo{justify-content:center}
.wz-foot.solo #wzNext{margin:0 auto}
.wz-body>*{animation:fadeUp .4s var(--ease) both}
.wz-spin{border-color:#e8ede0;border-top-color:var(--gold)}

  .tab svg{width:46px;height:28px;padding:3px 12px;border-radius:999px;transition:background .3s var(--ease)}

function dishMethods(d){ const c=COOK[d.id]||{cm:"st"}; return c.cm==="none" ? ["none"] : [c.cm, ...Object.keys(c.w||{})]; }
function kitchenOf(state){ return state.kitchen || {have:["st","ov","mw"], fav:"", maxTime:0}; }
function canCook(d, K){ const ms=dishMethods(d); return ms[0]==="none" || ms.some(m=>K.have.includes(m)); }
function bestMethod(d, K){
  const ms=dishMethods(d); if (ms[0]==="none") return "none";
  if (K.fav && ms.includes(K.fav) && K.have.includes(K.fav)) return K.fav;
  return ms.find(m=>K.have.includes(m)) || ms[0];
}

function dishInfo(d){
  if (d._info) return d._info;
  let kcal=0,p=0,f=0,c=0,cost=0,g=0; const al=new Set(), tags=new Set(d.t);
  d.i.forEach(([k,gr])=>{
    const x=ING[k]; const r=gr/100;
    kcal+=x[1]*r; p+=x[2]*r; f+=x[3]*r; c+=x[4]*r; cost+=x[5]*gr/1000; g+=gr;
    x[6].forEach(a=>al.add(a));
    if (PROTEIN_TAG[k] && !(k==="egg" && gr<40)) tags.add(PROTEIN_TAG[k]);
  });
  return d._info = {kcal,p,f,c,cost,g,al:[...al],tags:[...tags],density:kcal/g*100,protShare:p*4/Math.max(kcal,1)};
}

// --- Тип человека по возрасту ---
function personType(p){ return p.age < 3 ? "infant" : p.age < 18 ? "child" : "adult"; }

// --- Суточные нормы ---
function targets(p){
  const t = personType(p);
  let kcal, prot, fat, note="";
  if (t==="adult"){
    const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==="m" ? 5 : -161);
    kcal = bmr * p.activity;
    if (p.goal==="gain") kcal *= 1.12;
    if (p.goal==="lose") kcal = Math.max(kcal*0.85, p.sex==="m" ? 1500 : 1300);
    prot = p.weight * ({keep:1.2, gain:1.8, lose:1.6}[p.goal] || 1.2);
    fat = kcal * (p.goal==="lose" ? 0.28 : 0.30) / 9;
    note = "Формула Миффлина – Сан Жеора × активность" + (p.goal==="gain" ? " + 12%" : p.goal==="lose" ? " − 15%" : "");
  } else if (t==="child"){
    const a=p.age, m=p.sex==="m";
    kcal = a<7 ? 1800 : a<11 ? 2100 : a<14 ? (m?2400:2200) : (m?2700:2300);
    prot = kcal*0.15/4; fat = kcal*0.30/9;
    note = "Возрастной ориентир для детей " + (a<7?"3–7":a<11?"7–11":a<14?"11–14":"14–18") + " лет";
  } else {
    kcal = Math.min(Math.max(p.weight*(p.age<1.5?100:95), 800), 1400);
    prot = Math.min(p.weight*4, 42); fat = prot*1.1;
    note = "Ориентир ~100 ккал и ~4 г белка на кг веса (1–3 года). Согласуйте с педиатром";
  }
  const carb = Math.max((kcal - prot*4 - fat*9)/4, 0);
  return {kcal:Math.round(kcal), p:Math.round(prot), f:Math.round(fat), c:Math.round(carb), note, type:t};
}

function formulaKcal(p){ return ((p.formulaAm||0)+(p.formulaPm||0)) * ING.formula[1]/100; }

// Сколько ккал человеку нужно на каждый приём пищи
function mealKcal(p){
  const T=targets(p);
  if (T.type==="infant"){
    const rest = Math.max(T.kcal - formulaKcal(p), 300);
    return {b:rest*0.25, l:rest*0.35, s:rest*0.15, d:rest*0.25};
  }
  return {b:T.kcal*0.25, l:T.kcal*0.35, d:T.kcal*0.30, s:T.kcal*0.10};
}

// Порция человека = нужные ккал на приём ÷ ккал базовой порции (в разумных пределах)
// Основное блюдо: закрывает ~75% приёма пищи, но не больше разумной порции
// (суп — не больше 1–1,15 тарелки, остальное — до 1,4–1,6 порции). Остаток добирают салат и добавка.
const MAIN_SHARE = {b:0.8, l:0.75, d:0.75, s:1};
// Суп: тарелка 250–350 г (при наборе массы до 420 г). Второе: не больше ~460 г (при наборе 560 г).
function mainCap(p, dish){ const I=dishInfo(dish), gain=p.goal==="gain";
  return I.tags.includes("суп") ? (gain?420:350)/I.g : Math.min(gain?1.6:1.4, (gain?560:460)/I.g); }
function mainLo(p, dish){ const I=dishInfo(dish); return I.tags.includes("суп") ? 250/I.g : 0.6; }
function portion(p, dish, meal, share){
  const k = dishInfo(dish).kcal, inf = personType(p)==="infant";
  if (inf) return Math.min(Math.max(mealKcal(p)[meal]/k, 0.5), 1.6);
  const sh = share!=null ? share : (meal==="s" ? 1 : MAIN_SHARE[meal]);
  if (meal==="s") return Math.min(Math.max(mealKcal(p)[meal]/k, 0.6), p.goal==="gain"?2:1.6);
  return Math.min(Math.max(mealKcal(p)[meal]*sh/k, mainLo(p,dish)), mainCap(p,dish));
}
// Из чего состоит приём пищи у конкретного человека: основное + салат/гарнир + добавка (хлеб, фрукт)
function mealParts(p, day, meal){
  if (personType(p)==="infant"){ const id=(day.baby[p.id]||{})[meal]; return id&&DISH_BY_ID[id] ? [{dish:DISH_BY_ID[id],k:portion(p,DISH_BY_ID[id],meal)}] : []; }
  if (meal==="s"){ const id=day.s[p.id]; return id&&DISH_BY_ID[id] ? [{dish:DISH_BY_ID[id],k:portion(p,DISH_BY_ID[id],"s")}] : []; }
  const main=DISH_BY_ID[day[meal]]; if(!main) return [];
  const need=mealKcal(p)[meal], parts=[{dish:main,k:portion(p,main,meal)}];
  let rem = need - dishInfo(main).kcal*parts[0].k;
  const side = day.x && DISH_BY_ID[day.x[meal]];
  if (side && rem>40){ const sk=Math.min(rem/dishInfo(side).kcal, p.goal==="gain"?1.6:1.2); if (sk>=0.4){ parts.push({dish:side,k:sk}); rem-=dishInfo(side).kcal*sk; } }
  if (rem>90){ const ex=DISH_BY_ID[meal==="b"?"xf":"xb"]; const ek=Math.min(rem/dishInfo(ex).kcal, meal==="b"?1.5:(p.goal==="gain"?3:2)); if (ek>=0.5) parts.push({dish:ex,k:Math.round(ek*2)/2}); }
  return parts;
}

// --- Генератор случайных чисел с зерном (одно и то же меню для одной недели) ---
function rng(seedStr){
  let h=1779033703^seedStr.length;
  for (let i=0;i<seedStr.length;i++){ h=Math.imul(h^seedStr.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; };
}

// --- Оценка блюда для одного человека ---
function personScore(p, dish){
  const I=dishInfo(dish); let s=0;
  (p.likes||[]).forEach(t=>{ if (I.tags.includes(t)) s+=2; });
  (p.dislikes||[]).forEach(x=>{ if (I.tags.includes(x) || dish.i.some(([k])=>k===x)) s-=5; });
  if (p.goal==="gain") s += (I.protShare-0.22)*20;
  if (p.goal==="lose") s += (I.protShare-0.22)*15 - Math.max(0, I.density-130)/40;
  return s;
}
const hasAllergen = (dish, set) => dishInfo(dish).al.some(a=>set.has(a));

// --- Техника на кухне: блюда, которые нечем приготовить, почти не выбираются ---
function kScore(d){ const K=kitchenOf(STATE_REF.s); let s=0;
  if (!canCook(d,K)) s-=30; else if (K.fav && dishMethods(d).includes(K.fav)) s+=2.5;
  if (K.maxTime && d.time>K.maxTime) s -= d.time>K.maxTime+10 ? 10 : 5;
  return s; }
const STATE_REF={s:{}};
// --- Сборка недели ---
function generateWeek(state, weekKey, seed){
  STATE_REF.s=state;
  const fam = state.family, shared = fam.filter(p=>personType(p)!=="infant"), infants = fam.filter(p=>personType(p)==="infant");
  const forbid = new Set(shared.flatMap(p=>p.allergens||[]));
  const ratings = state.ratings||{};
  const hist = {}; // использование в прошлые 2 недели
  const prevKeys = Object.keys(state.weeks||{}).filter(k=>k<weekKey).sort().slice(-2);
  prevKeys.forEach((k,idx)=>{ const w=state.weeks[k]; const wt = idx===prevKeys.length-1 ? 3 : 1.5;
    w.days.forEach(d=>["b","l","d"].forEach(m=>{ if(d[m]) hist[d[m]]=(hist[d[m]]||0)+wt; })); });
  const familyCost = (dish, meal) => dishInfo(dish).cost * shared.reduce((a,p)=>a+portion(p,dish,meal),0);

  function build(costW){
    const R = rng(weekKey+"|"+seed), used={}, days=[]; let fish=0, soups=0, liverBaby={};
    for (let di=0; di<7; di++){
      const day={s:{}, baby:{}}, dayTags=[];
      ["b","l","d"].forEach(meal=>{
        let best=null, bs=-1e9;
        DISHES.forEach(d=>{
          if (d.baby || d.side || d.extra || !d.m.includes(meal) || hasAllergen(d,forbid)) return;
          const I=dishInfo(d);
          let s = R()*2.5;
          shared.forEach(p=> s += personScore(p,d)/Math.max(shared.length,1)*1.5);
          if (ratings[d.id]===1) s+=3; s+=kScore(d); if (ratings[d.id]===-1) s-=8;
          s -= (used[d.id]||0)*50 + (hist[d.id]||0);
          if (I.tags.some(t=>dayTags.includes(t) && !["овощи","сладкое","каша"].includes(t))) s-=4;
          if (I.tags.includes("рыба")||I.tags.includes("морепродукты")){ if (fish>=2) s-=4; else if (di>=3 && fish===0) s+=3; }
          if (meal==="l" && I.tags.includes("суп")) s += soups<4 ? 3 : -4;
          if (I.tags.includes("печень")) s-=1;
          s -= costW * familyCost(d,meal);
          if (s>bs){ bs=s; best=d; }
        });
        if (best){ day[meal]=best.id; used[best.id]=(used[best.id]||0)+1; dayTags.push(...dishInfo(best).tags);
          const T=dishInfo(best).tags; if (T.includes("рыба")||T.includes("морепродукты")) fish++; if (T.includes("суп")) soups++; }
      });
      day.x={};
      ["b","l","d"].forEach(meal=>{
        const main=DISH_BY_ID[day[meal]]; if(!main || dishInfo(main).tags.includes("салат")) return;
        let best=null,bs=-1e9;
        DISHES.forEach(d=>{
          if (!d.side || !d.m.includes(meal) || hasAllergen(d,forbid)) return;
          let s=R()*3; shared.forEach(p=> s+=personScore(p,d)/Math.max(shared.length,1));
          if (ratings[d.id]===1) s+=3; if (ratings[d.id]===-1) s-=8;
          s -= (used["x"+d.id]||0)*4;
          if (dishInfo(d).tags.some(t=>dishInfo(main).tags.includes(t) && t!=="овощи")) s-=3;
          if (d.i.some(([k])=>main.i.some(([k2])=>k2===k && !["oil","olive","greens","garlic","sourcream"].includes(k)))) s-=2;
          if (s>bs){ bs=s; best=d; }
        });
        if (best){ day.x[meal]=best.id; used["x"+best.id]=(used["x"+best.id]||0)+1; }
      });
      shared.forEach(p=>{
        const al=new Set(p.allergens||[]); let best=null,bs=-1e9;
        DISHES.forEach(d=>{
          if (d.baby || d.side || d.extra || !d.m.includes("s") || hasAllergen(d,al)) return;
          let s=R()*2.5 + personScore(p,d)*1.5;
          if (p.goal==="gain") s += dishInfo(d).p/8;
          if (p.goal==="lose") s -= dishInfo(d).kcal/80;
          if (ratings[d.id]===1) s+=3; s+=kScore(d); if (ratings[d.id]===-1) s-=8;
          s -= (used["s"+p.id+d.id]||0)*6 + (day.b===d.id?20:0);
          s -= costW*dishInfo(d).cost*portion(p,d,"s");
          if (s>bs){bs=s;best=d;}
        });
        if (best){ day.s[p.id]=best.id; used["s"+p.id+best.id]=(used["s"+p.id+best.id]||0)+1; }
      });
      infants.forEach(p=>{
        const al=new Set(p.allergens||[]); const bd={}; const tagsToday=[];
        ["b","l","s","d"].forEach(meal=>{
          let best=null,bs=-1e9;
          DISHES.forEach(d=>{
            if (!d.baby || !d.m.includes(meal) || hasAllergen(d,al)) return;
            const I=dishInfo(d); let s=R()*2.5 + personScore(p,d)*1.5;
            if (ratings[d.id]===1) s+=3; s+=kScore(d); if (ratings[d.id]===-1) s-=8;
            s -= (used["k"+p.id+d.id]||0)*12;
            if (Object.values(bd).includes(d.id)) s-=40;
            if (I.tags.includes("печень") && liverBaby[p.id]) s-=100;
            if (I.tags.some(t=>tagsToday.includes(t) && !["овощи","каша","суп"].includes(t))) s-=4;
            if (s>bs){bs=s;best=d;}
          });
          if (best){ bd[meal]=best.id; used["k"+p.id+best.id]=(used["k"+p.id+best.id]||0)+1; tagsToday.push(...dishInfo(best).tags);
            if (dishInfo(best).tags.includes("печень")) liverBaby[p.id]=1; }
        });
        day.baby[p.id]=bd;
      });
      days.push(day);
    }
    return {key:weekKey, seed, days, created:new Date().toISOString()};
  }
  // Если бюджет превышен, пересобираем с растущим «штрафом за цену»
  let plan, w=0;
  for (const cw of [0,0.01,0.03,0.06,0.12,0.25,0.5]){
    plan = build(cw); w=cw;
    if (!state.settings.budget || weekCost(state,plan) <= state.settings.budget) break;
  }
  plan.costWeight=w;
  return plan;
}

// --- Все позиции недели: [человек, блюдо, приём] ---
function planItems(state, plan){
  const out=[];
  plan.days.forEach((day,di)=>{
    state.family.forEach(p=>{
      const meals = personType(p)==="infant" ? ["b","l","s","d"] : ["b","l","d","s"];
      meals.forEach(m=> mealParts(p,day,m).forEach(({dish,k})=>out.push({di,p,meal:m,dish,k})) );
    });
  });
  return out.filter(x=>x.dish);
}

function shoppingList(state, plan){
  const agg={};
  planItems(state,plan).forEach(({p,meal,dish,k})=>{
    dish.i.forEach(([id,g])=>{ agg[id]=(agg[id]||0)+g*k; });
  });
  state.family.filter(p=>personType(p)==="infant").forEach(p=>{
    agg.formula=(agg.formula||0)+((p.formulaAm||0)+(p.formulaPm||0))*7;
  });
  return Object.entries(agg).map(([id,g])=>({id,name:ING[id][0],dept:ING[id][7],g,cost:g/1000*ING[id][5]}));
}
function weekCost(state, plan){ return shoppingList(state,plan).reduce((a,x)=>a+x.cost,0); }

function dayNutrition(state, plan, di, p){
  const r={kcal:0,p:0,f:0,c:0};
  planItems(state,plan).filter(x=>x.di===di && x.p.id===p.id).forEach(({dish,meal,k})=>{
    const I=dishInfo(dish); r.kcal+=I.kcal*k; r.p+=I.p*k; r.f+=I.f*k; r.c+=I.c*k; });
  if (personType(p)==="infant"){ const ml=(p.formulaAm||0)+(p.formulaPm||0); const F=ING.formula;
    r.kcal+=F[1]*ml/100; r.p+=F[2]*ml/100; r.f+=F[3]*ml/100; r.c+=F[4]*ml/100; }
  return r;
}
function weekAvg(state, plan, p){
  const s={kcal:0,p:0,f:0,c:0};
  for (let d=0; d<7; d++){ const n=dayNutrition(state,plan,d,p); for (const k in s) s[k]+=n[k]/7; }
  return s;
}

// --- Автоматические рекомендации на неделю ---
function recommendations(state, plan){
  const rec=[]; const shared=state.family.filter(p=>personType(p)!=="infant");
  const forbid=new Set(shared.flatMap(p=>p.allergens||[]));
  const excluded=DISHES.filter(d=>!d.baby && hasAllergen(d,forbid)).length;
  if (forbid.size) rec.push({k:"info",t:`Из общего меню исключено ${excluded} ${plural(excluded,"блюдо","блюда","блюд")} с аллергенами: ${[...forbid].map(a=>ALLERGENS[a].toLowerCase()).join(", ")}.`});
  let fish=0, soups=0;
  plan.days.forEach(d=>["l","d"].forEach(m=>{ const x=DISH_BY_ID[d[m]]; if(!x) return; const T=dishInfo(x).tags;
    if (T.includes("рыба")||T.includes("морепродукты")) fish++; if (T.includes("суп")) soups++; }));
  rec.push({k: fish>=1?"good":"warn", t:`Рыба или морепродукты ${fish} ${plural(fish,"раз","раза","раз")} за неделю${fish<1?" — стоит добавить хотя бы один рыбный день":""}. Супов на обед: ${soups}.`});
  state.family.forEach(p=>{
    const T=targets(p), A=weekAvg(state,plan,p), pr=A.p/T.p;
    if (T.type==="infant"){
      rec.push({k:"info",t:`${p.name}: смесь ${p.formulaAm||0} мл утром и ${p.formulaPm||0} мл перед сном, четыре приёма пищи без соли и сахара. В среднем ${Math.round(A.kcal)} из ${T.kcal} ккал, белок ${Math.round(A.p)} г. Новые продукты вводите по одному.`});
      return;
    }
    if (A.kcal < T.kcal*0.9 && p.goal!=="lose") rec.push({k:"warn",t:`${p.name}: в среднем ${Math.round(A.kcal)} ккал из ${T.kcal}. Добавьте второй перекус или хлеб к обеду.`});
    if (p.goal==="gain" && pr<0.9) rec.push({k:"warn",t:`${p.name} (набор массы): белка в среднем ${Math.round(A.p)} г из ${T.p} г. Добавьте второй перекус: творог, яйца или йогурт.`});
    else if (p.goal==="gain") rec.push({k:"good",t:`${p.name} (набор массы): белок ${Math.round(A.p)} г из ${T.p} г, калорийность ${Math.round(A.kcal)} ккал. Норма выполняется.`});
    if (p.goal==="lose") rec.push({k: pr>=0.85?"good":"warn",t:`${p.name} (снижение веса): ${Math.round(A.kcal)} ккал при норме ${T.kcal}, белок ${Math.round(A.p)} г из ${T.p} г. Порции рассчитаны меньше, в перекусах выбраны лёгкие варианты.`});
  });
  const cost=weekCost(state,plan), b=state.settings.budget;
  if (b) rec.push({k: cost<=b?"good":"warn", t: cost<=b ? `Продукты на неделю ≈ ${rub(cost)}, укладываемся в бюджет ${rub(b)}.` : `Продукты ≈ ${rub(cost)} при бюджете ${rub(b)}. Программа уже заменила самые дорогие блюда; увеличьте бюджет или уберите дорогие продукты.`});
  const dis=Object.entries(state.ratings||{}).filter(([,v])=>v===-1).length;
  if (dis) rec.push({k:"info",t:`Учтены ваши оценки: ${dis} ${plural(dis,"блюдо","блюда","блюд")} с 👎 теперь появляются реже.`});
  return rec;
}

function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return c; if(n1>1&&n1<5) return b; if(n1===1) return a; return c; }
function rub(x){ return Math.round(x).toLocaleString("ru-RU")+" ₽"; }

// --- Недели: ключ = дата понедельника ---
function mondayKey(date){
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate()); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function addDays(key,n){ const [y,m,d]=key.split("-").map(Number); const x=new Date(y,m-1,d+n); return mondayKey(x); }
function keyToDate(key,plus=0){ const [y,m,d]=key.split("-").map(Number); return new Date(y,m-1,d+plus); }

const PROT = ["chick","chthigh","turkey","beef","mince","pork","liver","salmon","cod","pollock","tuna","shrimp","tofu","rabbit"];
const GRAIN = ["rice","buck","bulgur","millet","pasta","potato","oat"];
const VEG = ["broccoli","pepper","zucchini","carrot","tomato","cucumber","cabbage","spinach","peas","corn","beans","pumpkin","mushroom","cauli","beet","radish","avocado"];
const ART_CACHE = {};
function artRng(seed){ let h=2166136261; for (const c of seed) h=Math.imul(h^c.charCodeAt(0),16777619); return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
function shade(hex, f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255; r=Math.round(Math.min(255,Math.max(0,r*f))); g=Math.round(Math.min(255,Math.max(0,g*f))); b=Math.round(Math.min(255,Math.max(0,b*f))); return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
function ings(d){ return d.i.map(([k,g])=>({k,g})).sort((a,b)=>b.g-a.g); }
function has(d,k){ return d.i.some(([x])=>x===k); }

function artKind(d){
  const T=dishInfo(d).tags, id=d.id;
  if (T.includes("суп")) return "soup";
  if (["b02","b09"].includes(id)) return "stack";
  if (["b10"].includes(id)) return "pan";
  if (["b03","d23","k04","b16"].includes(id)) return "omelet";
  if (["s01","x14","s09","k17"].includes(id)) return "glass";
  if (["s04","s11","x11","x13","xf","k16","s10"].includes(id)) return "fruit";
  if (["b13","d14"].includes(id)) return "bake";
  if (["b06","b14","b15","b12","s05","s07","x12","xb","d19"].includes(id)) return "bread";
  if (id==="s08") return "salad";
  if (T.includes("салат") || d.side) return "salad";
  if (d.baby || T.includes("каша") && d.m.includes("b") || ["b05","b08","b13","b17","s02","s03","s06","x07"].includes(id)) return "bowl";
  return "plate";
}

function placeholder(d){
  if (ART_CACHE[d.id]) return ART_CACHE[d.id];
  const R=artRng(d.id), I=ings(d), kind=artKind(d), out=[];
  const W=400,H=300, cx=200, cy=150;
  const add=x=>out.push(x);
  const dot=(x,y,r,c,o=1)=>add(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${c}" opacity="${o}"/>`);
  const inCircle=(r)=>{ const a=R()*Math.PI*2, rr=Math.sqrt(R())*r; return [cx+Math.cos(a)*rr, cy+Math.sin(a)*rr*0.86]; };
  // стол, салфетка, приборы
  add(`<defs><linearGradient id="tb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ead9bd"/><stop offset="1" stop-color="#d9c29c"/></linearGradient>
    <radialGradient id="pl" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe9dc"/></radialGradient>
    <radialGradient id="vg" cx="50%" cy="50%" r="75%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#3b2a14" stop-opacity=".18"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5a4020" flood-opacity=".28"/></filter></defs>
    <rect width="${W}" height="${H}" fill="url(#tb)"/>`);
  for (let i=0;i<9;i++){ const y=R()*H; add(`<path d="M0 ${y.toFixed(0)} Q${W/2} ${(y+(R()-.5)*30).toFixed(0)} ${W} ${(y+(R()-.5)*20).toFixed(0)}" stroke="#c4a679" stroke-width="${(0.6+R()*1.2).toFixed(1)}" fill="none" opacity=".35"/>`); }
  const nap=R()<.5; add(nap?`<path d="M0 ${H} L0 190 Q60 205 110 ${H}Z" fill="#e7ece0" opacity=".95"/><path d="M0 205 Q55 215 98 ${H}" stroke="#c9d3bb" stroke-width="2" fill="none"/>`
                         :`<path d="M${W} 0 L${W} 110 Q330 95 300 0Z" fill="#f3ece0"/><path d="M${W} 95 Q340 85 312 0" stroke="#dcd0bb" stroke-width="2" fill="none"/>`);
  const utX = nap ? 345 : 52;
  add(`<g opacity=".9"><rect x="${utX-3}" y="70" width="6" height="170" rx="3" fill="#cfc6b6"/><ellipse cx="${utX}" cy="70" rx="11" ry="20" fill="#ddd5c6"/></g>`);
  const base = I.find(x=>GRAIN.includes(x.k)) , prot = I.find(x=>PROT.includes(x.k)), vegs = I.filter(x=>VEG.includes(x.k));
  const col = k => ICOL[k] || "#d9c7a0";

  if (kind==="soup"){
    const broth = has(d,"beet")?"#a42c3a": has(d,"tomato")||has(d,"tomatopaste")?"#d4542f": has(d,"pumpkin")?"#f0a040": has(d,"lentil")?"#e39a46": has(d,"mushroom")?"#d8c3a2": has(d,"cheese")?"#efd38a": has(d,"kefir")?"#f6f2e6":"#e9c873";
    add(`<g filter="url(#sh)"><ellipse cx="${cx}" cy="${cy}" rx="118" ry="104" fill="url(#pl)"/></g><ellipse cx="${cx}" cy="${cy}" rx="96" ry="84" fill="${shade(broth,.9)}"/><ellipse cx="${cx-6}" cy="${cy-6}" rx="88" ry="76" fill="${broth}"/>`);
    add(`<ellipse cx="${cx-30}" cy="${cy-28}" rx="34" ry="14" fill="#fff" opacity=".18"/>`);
    I.filter(x=>!["oil","tomatopaste","kefir","garlic","sourcream","bread","greens","cheese","lemon","butter"].includes(x.k)).slice(0,5).forEach(x=>{
      for (let i=0;i<7;i++){ const [px,py]=inCircle(68); const s=4+R()*6; add(`<rect x="${(px-s/2).toFixed(1)}" y="${(py-s/2).toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}" rx="2" fill="${col(x.k)}" transform="rotate(${(R()*90).toFixed(0)} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); } });
    if (has(d,"sourcream")||has(d,"kefir")&&false) { add(`<path d="M${cx+8} ${cy-4} q14 -10 26 2 q8 12 -8 16 q-22 4 -18 -18z" fill="#fffdf6"/>`); }
    if (has(d,"lemon")) add(`<circle cx="${cx+40}" cy="${cy+26}" r="13" fill="#f6dc4a" stroke="#f9ec9a" stroke-width="3"/>`);
    for (let i=0;i<14;i++){ const [px,py]=inCircle(70); dot(px,py,1.6+R()*1.6,"#4f8a33"); }
    if (has(d,"bread")) add(`<g filter="url(#sh)"><rect x="${cx+92}" y="${cy+50}" width="70" height="52" rx="14" fill="#b98552" transform="rotate(-14 ${cx+127} ${cy+76})"/><rect x="${cx+98}" y="${cy+56}" width="58" height="40" rx="10" fill="#e6c79a" transform="rotate(-14 ${cx+127} ${cy+76})"/></g>`);
  }
  else if (kind==="bowl"){
    const b = I.find(x=>["oat","buck","rice","millet","bulgur","cottage","yogurt","pumpkin","lentil","chickpea","carrot","zucchini","beet","pear","apple"].includes(x.k)) || I[0], bc = col(b.k);
    add(`<g filter="url(#sh)"><ellipse cx="${cx}" cy="${cy}" rx="108" ry="96" fill="url(#pl)"/></g><ellipse cx="${cx}" cy="${cy}" rx="86" ry="76" fill="${shade(bc,.92)}"/><ellipse cx="${cx-4}" cy="${cy-4}" rx="80" ry="70" fill="${bc}"/>`);
    for (let i=0;i<40;i++){ const [px,py]=inCircle(72); dot(px,py,1.2+R()*1.6,shade(bc, .85+R()*.25),.7); }
    I.slice(1).filter(x=>!["milk","formula","sugar","oil","butter","honey","flour","egg"].includes(x.k)).slice(0,3).forEach((x,j)=>{
      const n = x.k==="berries"?9: x.k==="banana"?6: x.k==="walnut"?6:7;
      for (let i=0;i<n;i++){ const [px,py]=inCircle(52); const r = x.k==="banana"?9: x.k==="walnut"?6:6;
        if (x.k==="banana") { dot(px,py,r,"#f8e7a6"); dot(px,py,2,"#cdb26a",.6); }
        else if (x.k==="berries") { dot(px,py,r,["#7a2e5c","#b5283e","#3f2f6a"][i%3]); dot(px-2,py-2,1.6,"#fff",.5); }
        else add(`<rect x="${(px-5).toFixed(1)}" y="${(py-5).toFixed(1)}" width="10" height="10" rx="3" fill="${col(x.k)}" transform="rotate(${(R()*90).toFixed(0)} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); } });
    if (has(d,"butter")) add(`<rect x="${cx-10}" y="${cy-12}" width="22" height="16" rx="4" fill="#f8e08c" stroke="#fff3c2" stroke-width="2"/>`);
    if (has(d,"honey")) add(`<path d="M${cx-50} ${cy-10} q30 -20 60 0 t50 6" stroke="#e8a83a" stroke-width="4" fill="none" opacity=".8" stroke-linecap="round"/>`);
    if (has(d,"sourcream")) add(`<path d="M${cx+10} ${cy+8} q16 -12 30 2 q8 14 -10 18 q-24 4 -20 -20z" fill="#fffdf6"/>`);
    if (d.baby) add(`<rect x="${cx+70}" y="${cy-90}" width="14" height="120" rx="7" fill="#f2c6b6" transform="rotate(28 ${cx+77} ${cy-30})"/><ellipse cx="${cx+60}" cy="${cy-96}" rx="16" ry="11" fill="#f2c6b6" transform="rotate(28 ${cx+60} ${cy-96})"/>`);
  }
  else if (kind==="salad"){
    add(`<g filter="url(#sh)"><ellipse cx="${cx}" cy="${cy}" rx="122" ry="106" fill="url(#pl)"/></g><ellipse cx="${cx}" cy="${cy}" rx="100" ry="88" fill="none" stroke="#e6dfcf" stroke-width="2"/>`);
    const parts = I.filter(x=>!["oil","olive","lemon","garlic","sugar","soysauce","bread"].includes(x.k));
    const lead = parts[0] ? col(parts[0].k) : "#cfe0a8";
    add(`<path d="M${cx-78} ${cy+6} q4 -66 78 -70 q76 4 80 70 q-6 60 -80 62 q-74 -2 -78 -62z" fill="${shade(lead,1.25)}" opacity=".55"/>`);
    for (let i=0;i<10;i++){ const [px,py]=inCircle(66); add(`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="16" ry="9" fill="${["#9cc06a","#b8d58a","#7fae55"][i%3]}" opacity=".55" transform="rotate(${(R()*180).toFixed(0)} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); }
    parts.forEach(x=>{ const n = Math.min(24, 7 + Math.round(x.g/7));
      for (let i=0;i<n;i++){ const [px,py]=inCircle(70); const rot=(R()*180).toFixed(0);
        if (x.k==="cucumber"){ dot(px,py,11,"#5d9a3e"); dot(px,py,8,"#cfe6a8"); dot(px,py,2.5,"#a8cc7c"); }
        else if (x.k==="tomato"){ add(`<path d="M${px} ${py} l16 -8 a17 17 0 0 1 -5 21z" fill="#e2432f" transform="rotate(${rot} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); }
        else if (["cabbage","carrot","sauerkraut"].includes(x.k)){ add(`<path d="M${(px-14).toFixed(1)} ${py.toFixed(1)} q14 -8 28 0" stroke="${col(x.k)}" stroke-width="4.5" fill="none" stroke-linecap="round" transform="rotate(${rot} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); }
        else if (x.k==="egg"){ if(i<2){ dot(px,py,11,"#fffdf6"); dot(px,py,5.5,"#f5c63a"); } }
        else if (x.k==="greens"||x.k==="spinach"){ add(`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="5" ry="2.5" fill="#4f8a33" transform="rotate(${rot} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); }
        else if (["beans","corn","peas","raisins"].includes(x.k)){ add(`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="4.5" ry="3.2" fill="${col(x.k)}" transform="rotate(${rot} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); }
        else if (x.k==="sourcream"){ if(i===0) add(`<path d="M${cx-8} ${cy-6} q14 -10 26 2 q8 12 -8 16 q-22 4 -18 -18z" fill="#fffdf6"/>`); }
        else { const s=9+R()*6; add(`<rect x="${(px-s/2).toFixed(1)}" y="${(py-s/2).toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}" rx="2.5" fill="${col(x.k)}" transform="rotate(${rot} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); } } });
  }
  else if (kind==="stack"){
    add(`<g filter="url(#sh)"><ellipse cx="${cx}" cy="${cy+10}" rx="120" ry="98" fill="url(#pl)"/></g>`);
    for (let i=0;i<4;i++){ const x=cx-50+i*30+(R()-.5)*8, y=cy+10-i*10+(R()-.5)*8; add(`<ellipse cx="${x}" cy="${y}" rx="40" ry="32" fill="#c98a3c"/><ellipse cx="${x-2}" cy="${y-3}" rx="35" ry="27" fill="#e6b468"/>`); }
    add(`<path d="M${cx+30} ${cy-20} q18 -14 34 2 q10 16 -10 20 q-28 4 -24 -22z" fill="#fffdf6"/>`);
    for (let i=0;i<8;i++) dot(cx-60+R()*120, cy+40+R()*20, 3, "#7a2e5c", .8);
  }
  else if (kind==="pan" || kind==="omelet"){
    if (kind==="pan") add(`<rect x="${cx+90}" y="${cy-14}" width="110" height="22" rx="11" fill="#2f2a24" transform="rotate(-18 ${cx+90} ${cy})"/><g filter="url(#sh)"><circle cx="${cx}" cy="${cy}" r="112" fill="#2f2a24"/></g><circle cx="${cx}" cy="${cy}" r="98" fill="#c8402c"/>`);
    else add(`<g filter="url(#sh)"><ellipse cx="${cx}" cy="${cy}" rx="120" ry="104" fill="url(#pl)"/></g><path d="M${cx-80} ${cy} q10 -60 80 -62 q76 2 84 62 q-8 46 -84 48 q-74 -2 -80 -48z" fill="#f4cf55"/><path d="M${cx-70} ${cy} q10 -48 70 -50" stroke="#e9b93a" stroke-width="3" fill="none" opacity=".6"/>`);
    if (kind==="pan") for (let i=0;i<2;i++){ const x=cx-34+i*62, y=cy-10+i*18; dot(x,y,26,"#fffdf6"); dot(x+2,y+1,11,"#f5b922"); }
    I.filter(x=>VEG.includes(x.k)||x.k==="chick"||x.k==="cheese").forEach(x=>{ for(let i=0;i<8;i++){ const [px,py]=inCircle(62); add(`<rect x="${(px-4).toFixed(1)}" y="${(py-4).toFixed(1)}" width="8" height="8" rx="2" fill="${col(x.k)}" transform="rotate(${(R()*90).toFixed(0)} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); } });
    for (let i=0;i<12;i++){ const [px,py]=inCircle(70); dot(px,py,1.8,"#4f8a33"); }
  }
  else if (kind==="bake"){
    add(`<g filter="url(#sh)"><rect x="${cx-130}" y="${cy-92}" width="260" height="184" rx="26" fill="#f2ece0"/></g><rect x="${cx-112}" y="${cy-76}" width="224" height="152" rx="18" fill="${has(d,"zucchini")?"#d9b45a":"#e8c178"}"/>`);
    for (let i=0;i<60;i++) dot(cx-104+R()*208, cy-68+R()*136, 2+R()*5, shade(has(d,"zucchini")?"#d9b45a":"#e8c178", .8+R()*.3), .7);
    add(`<rect x="${cx-40}" y="${cy-40}" width="70" height="56" rx="6" fill="${has(d,"zucchini")?"#e7cc80":"#f3d99a"}" stroke="#c99a52" stroke-width="2" transform="rotate(-6 ${cx} ${cy})"/>`);
    if (has(d,"zucchini")) for (let i=0;i<10;i++) dot(cx-100+R()*200, cy-60+R()*120, 3, "#6f9a42", .8);
    if (has(d,"raisins")) for (let i=0;i<12;i++) dot(cx-100+R()*200, cy-60+R()*120, 3, "#5a2e2a", .8);
    add(`<path d="M${cx+60} ${cy+40} q16 -12 30 2 q8 14 -10 18 q-24 4 -20 -20z" fill="#fffdf6"/>`);
  }
  else if (kind==="glass"){
    add(`<g filter="url(#sh)"><path d="M${cx-46} ${cy-92} L${cx+46} ${cy-92} L${cx+36} ${cy+94} Q${cx} ${cy+104} ${cx-36} ${cy+94} Z" fill="#ffffff" opacity=".55"/></g>
      <path d="M${cx-42} ${cy-60} L${cx+42} ${cy-60} L${cx+35} ${cy+90} Q${cx} ${cy+98} ${cx-35} ${cy+90} Z" fill="${has(d,"banana")?"#f6ecc2":"#fbf8f1"}"/>
      <path d="M${cx-30} ${cy-56} L${cx-24} ${cy+80}" stroke="#fff" stroke-width="5" opacity=".7"/>`);
    if (has(d,"apple")) add(`<g filter="url(#sh)"><circle cx="${cx+100}" cy="${cy+50}" r="40" fill="#d8483a"/><circle cx="${cx+88}" cy="${cy+36}" r="10" fill="#fff" opacity=".25"/><path d="M${cx+100} ${cy+12} q4 -14 14 -18" stroke="#6b4a2a" stroke-width="4" fill="none"/></g>`);
    if (has(d,"banana")) add(`<path d="M${cx+60} ${cy+70} q60 30 100 -30 q-40 40 -100 30z" fill="#f6d65a" stroke="#d9b23a" stroke-width="2"/>`);
  }
  else if (kind==="fruit"){
    add(`<g filter="url(#sh)"><ellipse cx="${cx}" cy="${cy}" rx="120" ry="104" fill="url(#pl)"/></g>`);
    const fr = has(d,"mandarin")?["#f39a2a"]: has(d,"apple")?["#d8483a","#e46a3a"]: ["#c9d36a"];
    const n = has(d,"mandarin")?4:2;
    for (let i=0;i<n;i++){ const x=cx-40+i*(80/(n-1||1)), y=cy-10+(i%2)*26; add(`<circle cx="${x}" cy="${y}" r="${has(d,"mandarin")?28:36}" fill="${fr[i%fr.length]}"/><circle cx="${x-10}" cy="${y-12}" r="8" fill="#fff" opacity=".22"/>`); }
    if (has(d,"walnut")) for (let i=0;i<6;i++){ const [px,py]=inCircle(70); dot(px,py+30,7,"#a8784a"); }
    if (has(d,"banana")) add(`<path d="M${cx-60} ${cy+40} q60 30 110 -20 q-40 40 -110 20z" fill="#f6d65a"/>`);
    if (has(d,"cottage")) add(`<path d="M${cx-14} ${cy-30} q16 -14 30 0 q10 14 -12 16 q-22 2 -18 -16z" fill="#fffdf6"/>`);
  }
  else if (kind==="bread"){
    add(`<g filter="url(#sh)"><rect x="${cx-140}" y="${cy-80}" width="280" height="170" rx="22" fill="#c9a77a"/><rect x="${cx-132}" y="${cy-72}" width="264" height="154" rx="18" fill="#dcbf93"/></g>`);
    const nB = d.id==="d19" ? 1 : 2;
    for (let i=0;i<nB;i++){ const x=cx-(nB===1?70:100)+i*110, y=cy-50;
      add(`<rect x="${x}" y="${y}" width="${nB===1?140:90}" height="${nB===1?90:96}" rx="16" fill="${has(d,"lavash")?"#e9cf98":has(d,"crisp")?"#c99c63":"#a56f3e"}"/><rect x="${x+6}" y="${y+6}" width="${(nB===1?140:90)-12}" height="${(nB===1?90:96)-12}" rx="12" fill="${has(d,"lavash")?"#f3e2b8":has(d,"crisp")?"#dcb57c":"#e2c08e"}"/>`);
      const tops = I.filter(x=>!["bread","lavash","crisp","ryebread","oil","butter","garlic"].includes(x.k));
      tops.forEach(t=>{ for(let j=0;j<4;j++){ const px=x+16+R()*((nB===1?140:90)-32), py=y+16+R()*60;
        if (t.k==="cucumber"){ dot(px,py,9,"#5d9a3e"); dot(px,py,6.5,"#cfe6a8"); }
        else if (t.k==="egg"){ if(j===0){ dot(x+45,y+48,24,"#fffdf6"); dot(x+46,y+48,10,"#f5b922"); } }
        else if (t.k==="cheese"){ if(j<2) add(`<rect x="${px-14}" y="${py-10}" width="28" height="20" rx="3" fill="#f5cf5f" opacity=".95"/>`); }
        else if (t.k==="banana"){ dot(px,py,8,"#f8e7a6"); }
        else if (t.k==="avocado"){ add(`<ellipse cx="${px}" cy="${py}" rx="14" ry="8" fill="#a6c55e" transform="rotate(${(R()*60).toFixed(0)} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); }
        else dot(px,py,6+R()*3,col(t.k)); } });
    }
    for (let i=0;i<8;i++) dot(cx-120+R()*240, cy+60+R()*18, 2, "#4f8a33");
  }
  else { // основное блюдо: гарнир + белок + овощи
    add(`<g filter="url(#sh)"><ellipse cx="${cx}" cy="${cy}" rx="126" ry="110" fill="url(#pl)"/></g><ellipse cx="${cx}" cy="${cy}" rx="102" ry="90" fill="none" stroke="#e6dfcf" stroke-width="2"/>`);
    if (base){ const bc=col(base.k);
      add(`<path d="M${cx-86} ${cy+4} q6 -58 58 -64 q34 6 36 64 q-6 50 -46 52 q-44 -2 -48 -52z" fill="${shade(bc,.92)}"/>`);
      const n = base.k==="pasta"?18:46;
      for (let i=0;i<n;i++){ const px=cx-80+R()*86, py=cy-50+R()*96;
        if (base.k==="pasta") add(`<path d="M${px.toFixed(0)} ${py.toFixed(0)} q8 -8 16 0" stroke="${bc}" stroke-width="5" fill="none" stroke-linecap="round"/>`);
        else add(`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${base.k==="potato"?6:2.6}" ry="${base.k==="potato"?5:1.8}" fill="${shade(bc,.9+R()*.25)}" transform="rotate(${(R()*180).toFixed(0)} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); } }
    if (prot){ const pc=col(prot.k), px=cx+38, py=cy-6;
      if (["mince","beef"].includes(prot.k) && (d.n.includes("Котлет")||d.n.includes("Тефтел")||d.n.includes("тефтел")||d.n.includes("котлет")))
        for (let i=0;i<3;i++){ const x=px-14+i*22, y=py-20+(i%2)*30; add(`<ellipse cx="${x}" cy="${y}" rx="22" ry="18" fill="${shade(pc,.8)}"/><ellipse cx="${x-3}" cy="${y-4}" rx="16" ry="12" fill="${pc}"/>`); }
      else if (prot.k==="shrimp") for (let i=0;i<6;i++){ const x=px-10+R()*40, y=py-30+R()*60; add(`<path d="M${x} ${y} a12 12 0 1 1 14 10" stroke="#f08a6c" stroke-width="7" fill="none" stroke-linecap="round"/>`); }
      else if (prot.k==="tofu") for (let i=0;i<6;i++){ const x=px-10+R()*40, y=py-30+R()*60; add(`<rect x="${x}" y="${y}" width="18" height="18" rx="3" fill="#e9d6a6" stroke="#c9a96a" stroke-width="2"/>`); }
      else { add(`<path d="M${px-36} ${py} q4 -40 44 -42 q34 4 34 42 q-4 34 -40 36 q-36 -2 -38 -36z" fill="${shade(pc,.82)}"/><path d="M${px-30} ${py-2} q4 -32 38 -34 q28 4 28 34 q-4 26 -32 28 q-30 -2 -34 -28z" fill="${pc}"/>`);
        if (["salmon","chick","turkey","pork","chthigh"].includes(prot.k)) for (let i=0;i<3;i++) add(`<path d="M${px-22+i*14} ${py-26} l14 46" stroke="${shade(pc,.62)}" stroke-width="3" opacity=".55" stroke-linecap="round"/>`); } }
    vegs.slice(0,3).forEach((v,j)=>{ for (let i=0;i<6;i++){ const ang=(Math.PI*0.15)+ (j*0.55+i*0.12)*Math.PI*0.6, rr=70+R()*16, px=cx+Math.cos(ang)*rr*.9, py=cy+Math.sin(ang)*rr*.85;
      if (v.k==="broccoli"){ dot(px,py,9,"#3f7a2c"); dot(px-4,py-3,6,"#5b9a3e"); dot(px+4,py-2,6,"#4c8a35"); }
      else if (v.k==="cucumber"){ dot(px,py,8,"#5d9a3e"); dot(px,py,6,"#cfe6a8"); }
      else if (v.k==="tomato") { dot(px,py,8,"#e2432f"); dot(px-2,py-2,2,"#fff",.4); }
      else add(`<rect x="${(px-9).toFixed(1)}" y="${(py-3).toFixed(1)}" width="18" height="7" rx="3" fill="${col(v.k)}" transform="rotate(${(R()*180).toFixed(0)} ${px.toFixed(0)} ${py.toFixed(0)})"/>`); } });
    if (has(d,"sourcream")) add(`<path d="M${cx+24} ${cy+40} q14 -10 26 2 q8 12 -8 16 q-22 4 -18 -18z" fill="#fffdf6"/>`);
    if (has(d,"lemon")) add(`<path d="M${cx+60} ${cy+30} a18 18 0 0 1 30 18z" fill="#f6dc4a" stroke="#f9ec9a" stroke-width="3"/>`);
    for (let i=0;i<10;i++) dot(cx-60+R()*130, cy-40+R()*90, 1.8, "#4f8a33");
    if (has(d,"sesame")) for (let i=0;i<14;i++) dot(cx+10+R()*60, cy-30+R()*50, 1.2, "#fbf3dc");
  }
  add(`<rect width="${W}" height="${H}" fill="url(#vg)"/>`);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${out.join("")}</svg>`;
  return ART_CACHE[d.id] = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

  };
}
let state;
try { state = JSON.parse(localStorage.getItem(STORE_KEY)) || defaultState(); } catch(e){ state = defaultState(); }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify({...state, weeks:pruneWeeks()})); } catch(e){} }
function pruneWeeks(){ const keys=Object.keys(state.weeks).sort().slice(-6); const o={}; keys.forEach(k=>o[k]=state.weeks[k]); return o; }

// --- Автоматика: текущая неделя всегда есть, с пятницы готовится следующая ---
const today = new Date(), curKey = mondayKey(today), nextKey = addDays(curKey,7);
let banner = "";
function ensureWeeks(){
  if (!state.weeks[curKey]) state.weeks[curKey] = generateWeek(state, curKey, "1");
  const wd = (today.getDay()+6)%7; // 0 = понедельник
  if (wd >= (state.settings.autoDay ?? 4) && !state.weeks[nextKey]){
    state.weeks[nextKey] = generateWeek(state, nextKey, "1");
    banner = "Готово меню на следующую неделю. Программа собрала его сама с учётом ваших оценок и того, что было в прошлые недели.";
  }
  if (!state.view || !state.weeks[state.view]) state.view = curKey;
  save();
}
function regenFromNow(newSeed){
  Object.keys(state.weeks).filter(k=>k>=curKey).sort().forEach(k=>{
    const seed = newSeed && k===state.view ? String(Math.random()).slice(2,8) : state.weeks[k].seed;
    state.weeks[k] = generateWeek(state, k, seed);
  });
  save();
}

// Порядок: своё загруженное фото → реальное фото из PHOTO_MANIFEST (по id) → рисованная иллюстрация.
// Если фото из сети не загрузилось (нет интернета, файл удалён) — тихо подменяется иллюстрацией.
function manifestPhoto(id){ const m = (typeof PHOTO_MANIFEST!=="undefined") && PHOTO_MANIFEST[id]; return m ? {url:m[0], page:m[1], status:m[2]} : null; }
function photoFallback(img){ img.onerror=null; const d=DISH_BY_ID[img.dataset.id]; if(d) img.src=placeholder(d); img.classList.add("fb"); }
function imgTag(d, cls){
  const up = getPhoto(d.id);
  const mp = up ? null : manifestPhoto(d.id);
  const src = up || (mp && mp.url) || placeholder(d);
  const alt = esc(d.n) + (mp ? (mp.status==="verified" ? " — фото блюда" : " — фото похожей подачи") : "");
  return `<img class="${cls}" src="${esc(src)}" alt="${alt}" data-id="${d.id}" loading="lazy" decoding="async"${mp?' referrerpolicy="no-referrer" onerror="photoFallback(this)"':''}>`;
}
function photoCredit(d){
  if (getPhoto(d.id)) return "";
  const mp = manifestPhoto(d.id); if (!mp) return "";
  return `<a class="pcred" href="${esc(mp.page)}" target="_blank" rel="noopener">Фото: Wikimedia Commons${mp.status==="verified"?"":" · похожая подача"}</a>`;
}
function imagePrompt(d){
  const main = d.i.slice(0,5).map(([k])=>ING[k][0].replace(/ \(.*\)/,"").toLowerCase()).join(", ");
  const baby = d.baby ? " Детская порция в маленькой керамической мисочке, нежная протёртая или мелко нарезанная текстура, рядом детская ложка." : "";
  return `Реалистичная фотография блюда «${d.n}». Состав: ${main}.${baby} Подача на светлом деревянном столе, льняная салфетка, керамическая посуда матовых природных оттенков, веточки свежей зелени. Мягкий дневной свет из окна, вид сверху под углом 45°, натуральные цвета, без текста, без людей, без логотипов. Формат 4:3.`;
}

// --- Округление граммовок: до 5 г (меньше 100), до 10 г (до 500), до 50 г (больше) ---
function nice(g){ if (g<=0) return 0; if (g<10) return Math.ceil(g); if (g<100) return Math.ceil(g/5)*5; if (g<500) return Math.ceil(g/10)*10; return Math.ceil(g/50)*50; }
function unit(id){ return LIQUID.includes(id) ? "мл" : "г"; }
function fmtG(id,g){
  if (id==="egg") { const n=Math.max(1,Math.round(g/55)); return `${n} шт`; }
  const v=nice(g), u=unit(id);
  if (v>=1000) return `${(Math.ceil(v/100)/10).toString().replace(".",",")} ${u==="мл"?"л":"кг"}`;
  return `${v} ${u}`;
}
function fmtQty(id,g){ return fmtG(id,g); }

// --- Цены: свои цены пользователя (например, из Пятёрочки) поверх средних ---
const DEFAULT_PRICE = {}; Object.keys(ING).forEach(k=>DEFAULT_PRICE[k]=ING[k][5]);
function packSize(id){ const o=(state.prices||{})[id]; return (o&&o.s) || PACK[id] || 1000; }
function packPrice(id){ const o=(state.prices||{})[id]; return o&&o.p ? o.p : null; }
function defaultPackPrice(id){ return Math.max(1, Math.round(DEFAULT_PRICE[id]*packSize(id)/1000)); }
function applyPrices(){
  Object.keys(ING).forEach(k=>{ const pp=packPrice(k); ING[k][5] = pp ? pp/packSize(k)*1000 : DEFAULT_PRICE[k]; });
  DISHES.forEach(d=>{ delete d._info; });
}
function hasOwnPrices(){ return Object.values(state.prices||{}).some(o=>o&&o.p); }
function pricesNote(){ return hasOwnPrices() ? `· по вашим ценам` : `· по средним ценам`; }
function packsFor(id,g){ return Math.max(1, Math.ceil(g/packSize(id) - 0.05)); }
function sizeLabel(id){ const s=packSize(id); if (id==="egg") return `${Math.round(s/55)} шт`; if (id==="formula") return `${Math.round(s/1000*800/6)} г сухой смеси`; return s>=1000 ? `${(s/1000).toString().replace(".",",")} ${unit(id)==="мл"?"л":"кг"}` : `${s} ${unit(id)}`; }

let shopMode="list", priceQ="";

  const plan=state.weeks[state.view], list=shoppingList(state,plan); const by={};
  list.forEach(x=>(by[x.dept]=by[x.dept]||[]).push(x));
  const got=state.got||{};
  const storeTotal=list.reduce((a,x)=>a+packsFor(x.id,x.g)*(packPrice(x.id)||defaultPackPrice(x.id)),0);
  let h=`<section class="head-row"><div><h2>Покупки</h2><p class="muted">${weekTitle(state.view)}</p></div>
    <div class="seg wide"><button class="segb ${shopMode==="list"?"on":""}" data-shop="list">Список</button><button class="segb ${shopMode==="prices"?"on":""}" data-shop="prices">Цены${hasOwnPrices()?` <span class="cnt">${Object.values(state.prices).filter(o=>o&&o.p).length}</span>`:""}</button></div></section>`;
  if (shopMode==="prices") return h+renderPrices();
  h+=`<div class="shopsum"><div><b>${rub(storeTotal)}</b><span class="muted"> в магазине ${hasOwnPrices()?"(часть цен — ваши)":"(средние цены)"}. Покупаем целыми упаковками, остатки пойдут на следующую неделю.</span></div><div class="acts">${weekSwitch()}<button class="btn ghost" id="copyShop">Скопировать</button></div></div>
    ${hasOwnPrices()?"":`<p class="note small">Чтобы сумма совпадала с Пятёрочкой, откройте вкладку «Цены» и впишите цены с ценников или из приложения магазина.</p>`}<section class="shop">`;
  Object.keys(by).sort().forEach(dep=>{
    h+=`<article class="dept"><h3>${esc(dep)}</h3><ul>${by[dep].sort((a,b)=>b.cost-a.cost).map(x=>{const k=state.view+x.id, n=packsFor(x.id,x.g), pp=packPrice(x.id)||defaultPackPrice(x.id);
      return `<li><label><input type="checkbox" data-got="${k}" ${got[k]?"checked":""}><span class="pn">${esc(x.name)}<small class="muted">${fmtQty(x.id,x.g)} · ${n} уп. по ${sizeLabel(x.id)}</small></span><span class="c">${rub(n*pp)}${packPrice(x.id)?"":'<small class="muted">≈</small>'}</span></label></li>`;}).join("")}</ul></article>`;
  });
  return h+`</section>`;
}
function renderPrices(){
  const by={}; Object.keys(ING).forEach(id=>{ const d=ING[id][7]; (by[d]=by[d]||[]).push(id); });
  const q=priceQ.toLowerCase();
  let h=`<p class="note small">Посмотрите цену на ценнике или в приложении Пятёрочки и впишите её за упаковку. Серым показана средняя цена: её можно оставить. После ввода пересчитаются стоимость недели и подбор блюд под бюджет.${state.pricesDate?` <b>Ваши цены обновлены ${new Date(state.pricesDate).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}.</b>`:""}</p>
    <div class="filters"><input id="pq" placeholder="Найти продукт" value="${esc(priceQ)}" aria-label="Найти продукт">${hasOwnPrices()?'<button class="pill" id="resetPrices">Вернуть средние цены</button>':""}</div><section class="shop">`;
  Object.keys(by).sort().forEach(dep=>{
    const ids=by[dep].filter(id=>!q||ING[id][0].toLowerCase().includes(q)); if(!ids.length) return;
    h+=`<article class="dept"><h3>${esc(dep)}</h3><ul class="prices">${ids.map(id=>`<li><span class="pn">${esc(ING[id][0])}<small class="muted">упаковка ${sizeLabel(id)}</small></span>
      <label class="pin"><input type="number" inputmode="decimal" step="0.01" min="0" data-price="${id}" value="${packPrice(id)??""}" placeholder="${defaultPackPrice(id)}" aria-label="Цена за упаковку: ${esc(ING[id][0])}"><span>₽</span></label></li>`).join("")}</ul></article>`;
  });
  return h+`</section>`;
}

function renderHow(){
  return `<section class="how"><h2>Как это работает</h2>
  <ol>
   <li><b>База продуктов.</b> Для каждого продукта записаны КБЖУ на 100 г, примерная цена за кг, аллергены и отдел магазина. Из этого программа сама считает КБЖУ, цену и аллергены любого блюда.</li>
   <li><b>Нормы каждого человека.</b> Для взрослых используется формула Миффлина – Сан Жеора с учётом активности: +12% при наборе массы, −15% при снижении веса. Белок 1,2–1,8 г на кг веса. Для малыша 1–3 лет ориентир около 100 ккал и 4 г белка на кг, а калории смеси вычитаются из нормы.</li>
   <li><b>Фильтр.</b> Блюда с аллергенами любого члена семьи исключаются из общего стола. Малыш получает блюда только из детской базы.</li>
   <li><b>Баллы.</b> Каждому блюду начисляются баллы: +2 за любимую категорию, −5 за нелюбимый продукт, бонус за белок при наборе массы, штраф за калорийность при диете. Ещё +3 за 👍, −8 за 👎, штраф за повтор на этой и прошлых неделях. Отдельно учитывается баланс: рыба 1–2 раза, супы на обед до 4 раз.</li>
   <li><b>Порции.</b> Одно блюдо на всю семью, но порция у каждого своя: нужные ккал на этот приём делятся на калорийность базовой порции.</li>
   <li><b>Бюджет.</b> Если сумма продуктов выше бюджета, программа пересобирает неделю, постепенно отдавая предпочтение более дешёвым блюдам.</li>
   <li><b>Автоматика.</b> Меню на текущую неделю появляется само. С выбранного дня (по умолчанию с пятницы) при открытии страницы сама собирается следующая неделя и выводятся рекомендации.</li>
  </ol>
  <h3>Установка на телефон</h3>
  <p><b>iPhone:</b> откройте страницу в Safari, нажмите «Поделиться» и выберите «На экран Домой». <b>Android:</b> откройте в Chrome, нажмите «Установить приложение» или ⋮ → «Добавить на главный экран». Приложение запускается с иконки, работает без интернета, данные хранятся на телефоне. Резервная копия есть во вкладке «Семья».</p>
  <p class="note">Это ориентир для домашнего планирования, а не медицинская диета. При аллергии проверяйте состав готовых продуктов по этикетке. Питание малыша и объём смеси согласуйте с педиатром.</p></section>`;
}

let modalCtx=null, modalMethod=null;
function openDish(id, slot){
  if (!modalCtx || modalCtx.id!==id) modalMethod=null;
  const d=DISH_BY_ID[id], I=dishInfo(d); modalCtx={id,slot};
  const plan=state.weeks[state.view];
  let eaters = state.family.filter(p=> d.baby ? personType(p)==="infant" : personType(p)!=="infant");
  if (slot && slot.p) eaters = eaters.filter(p=>p.id===slot.p);
  const meal = slot ? slot.m : d.m[0];
  const dayObj = slot && state.weeks[slot.w] ? state.weeks[slot.w].days[slot.di] : null;
  const kOf = p => { if (dayObj){ const part=mealParts(p,dayObj,meal).find(x=>x.dish.id===d.id); if (part) return part.k; if (d.side) return 1; } return d.side||d.extra ? 1 : portion(p,d,meal); };
  const plateRows = dayObj && meal!=="s" && !slot.baby ? eaters.map(p=>`<li><b>${esc(p.name)}:</b> ${mealParts(p,dayObj,meal).map(x=>`${esc(x.dish.n.toLowerCase())} ${fmtG("x",dishInfo(x.dish).g*x.k)}`).join(" + ")}</li>`).join("") : "";
  const rows = eaters.map(p=>{const k=kOf(p); return `<tr><td>${esc(p.name)}</td><td>${fmtG("x",I.g*k)}</td><td>${r0(I.kcal*k)}</td><td>${r0(I.p*k)}</td><td>${r0(I.f*k)}</td><td>${r0(I.c*k)}</td></tr>`;}).join("");
  const kSum = eaters.reduce((a,p)=>a+kOf(p),0) || 1;
  const r=state.ratings[id];
  $("#modal").innerHTML = `<div class="mbox" role="dialog" aria-modal="true" aria-label="${esc(d.n)}">
    <button class="close" id="mclose" aria-label="Закрыть">✕</button>
    <div class="mimg">${imgTag(d,"big")}${photoCredit(d)}</div>
    <div class="mbody">
      <h2>${esc(d.n)}</h2>
      <p class="muted">${d.time} мин · базовая порция ${nice(I.g)} г: ${r0(I.kcal)} ккал, Б ${r0(I.p)} · Ж ${r0(I.f)} · У ${r0(I.c)}${d.baby?" · без соли и сахара":""}</p>
      <div class="als">${I.al.map(a=>`<i class="al">${ALLERGENS[a]}</i>`).join("")||'<span class="muted">Основных аллергенов нет</span>'}</div>
      <div class="rate"><button class="pill ${r===1?"on":""}" data-rate="1">👍 Понравилось</button><button class="pill ${r===-1?"on":""}" data-rate="-1">👎 Не понравилось</button>${slot?`<button class="pill" id="swap">Заменить блюдо</button>`:""}</div>
      <h3>Порции и КБЖУ</h3><div class="tw"><table><thead><tr><th>Кто</th><th>Порция</th><th>ккал</th><th>Б</th><th>Ж</th><th>У</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${plateRows?`<h3>Вся тарелка</h3><ul class="plate">${plateRows}</ul><p class="muted small">Порция основного блюда ограничена разумным размером, остальное добирают салат и хлеб или фрукт.</p>`:""}
      <h3>Продукты${eaters.length>1?" на всех":""}</h3><ul class="ing">${d.i.map(([k,g])=>`<li><span>${esc(ING[k][0])}</span><span>${fmtG(k,g*kSum)}</span></li>`).join("")}</ul>
      <h3>Как приготовить</h3>${(()=>{ const Kc=kitchenOf(state), all=dishMethods(d); if(all[0]==="none") return `<p class="muted small">Готовить не нужно, только собрать.</p><ol class="steps">${d.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
        let ms=all.filter(m=>Kc.have.includes(m)); if(!ms.length) ms=all; if(!modalMethod||!ms.includes(modalMethod)) modalMethod=bestMethod(d,Kc); if(!ms.includes(modalMethod)) modalMethod=ms[0];
        return `${ms.length>1?`<div class="seg mseg">${ms.map(m=>`<button class="segb ${m===modalMethod?"on":""}" data-meth="${m}">${METHODS[m]}</button>`).join("")}</div>`:`<p class="muted small">Способ: ${METHODS[modalMethod]}</p>`}
        ${modalMethod!==(COOK[d.id]||{}).cm?`<p class="muted small">Продукты подготовьте как в основном рецепте (нарежьте, смешайте). Ниже — как довести блюдо до готовности.</p>`:""}<ol class="steps">${methodSteps(d,modalMethod).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${all.some(m=>!Kc.have.includes(m))?`<p class="muted small">Ещё можно: ${all.filter(m=>!Kc.have.includes(m)).map(m=>METHODS[m].toLowerCase()).join(", ")}.</p>`:""}`; })()}
      <details class="photo"><summary>Фото блюда</summary>
        <p class="muted">Скопируйте промпт, сгенерируйте картинку в ГигаЧате и загрузите её сюда.</p>
        <div class="prompt">${esc(imagePrompt(d))}</div>
        <div class="rate"><button class="pill" id="copyPrompt">Скопировать промпт</button><label class="pill file">Загрузить фото<input type="file" accept="image/*" id="photoIn"></label>${getPhoto(id)?'<button class="pill" id="delPhoto">Убрать фото</button>':""}</div>

    </div></div>`;
  $("#modal").hidden=false; document.body.classList.add("lock");
