name: photos
on:
  push:
    paths: [".github/workflows/photos.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p photos
          while read id url; do
            curl -sSL --retry 3 -A "NashStolBot/1.0 (family menu)" -o "photos/$id.jpg" "$url" || echo "fail $id"
